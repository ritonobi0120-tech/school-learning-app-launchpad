<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>面積の塔</title>
  <!-- build 20260917-26310 / PUBLIC_LOCAL_ONLY -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
  <style>
/* 面積の塔: 画面の見た目（デザイン handoff の値をそのまま使う）
 * 1画面・スクロールなし／角丸なし／太いわく＋かげ／DotGothic16
 * 文字の大きさは --fs（せってい）で まとめて変える
 */
:root { --fs: 1; --stone-w: clamp(26px, 4.4vh, 44px); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #1f2740; color: #2b2a3a;
  font-family: 'DotGothic16', 'BIZ UDGothic', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif;
  -webkit-text-size-adjust: 100%; }
button { font-family: inherit; border-radius: 0; }
#app { position: fixed; inset: 0; overflow: hidden; word-break: keep-all; overflow-wrap: break-word; line-break: strict; }
/* 文は 分かち書き（ことばの間に 空白）なので、行は 空白の ところで 折る（ことばの とちゅうで 折らない） */
ruby rt { font-size: max(0.5em, 9px); letter-spacing: 0; }

/* ---- アニメ（すべて steps でコマ送り） ---- */
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes walk { 0% { transform: translateY(0); } 50% { transform: translateY(-2px); } 100% { transform: translateY(0); } }
@keyframes twinkle { 0%, 100% { opacity: 0.15; } 50% { opacity: 1; } }
@keyframes blink { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.7; } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
@keyframes stampin { 0% { opacity: 0; transform: scale(2.2); } 60% { opacity: 1; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1); } }
@keyframes slamup { 0% { transform: translateY(100%); } 100% { transform: translateY(0); } }
@keyframes okflash { 0% { background: #fff3c4; } 60% { background: #e7f3e4; } 100% { background: #f6efd9; } }
@keyframes sparkle { 0% { opacity: 0; transform: translate(0, 0) scale(0.6); } 40% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.4); } }
@keyframes pop { 0% { opacity: 0; transform: scale(1.8); } 70% { opacity: 1; transform: scale(0.94); } 100% { opacity: 1; transform: scale(1); } }
@keyframes shine { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
@keyframes flicker { 0%, 100% { opacity: 0.82; } 40% { opacity: 1; } 70% { opacity: 0.9; } }
@keyframes cutin { from { opacity: 0; } to { opacity: 1; } }
@keyframes lightup { from { background: #f6efd9; } to { background: #ffd37c; } }

/* ---- 背景の絵（4:3 を cover） ---- */
.bg { --bgh: max(100vh, calc(100vw * 3 / 4)); position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: max(100vw, calc(100vh * 4 / 3)); height: var(--bgh); container-type: size; }
/* ホーム: 横に長い画面では 絵の 上下が 切れる。地面と 門（絵の 下から 7% の ところ）が 画面の 下に くるように 下へ よせる（下の 圧迫感を なくす） */
.bg.low { top: clamp(calc(100vh - var(--bgh)), calc(100vh - var(--bgh) * 0.93), 0px); transform: translateX(-50%); }
.bg canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; display: block; }
.bg .tint { position: absolute; inset: 0; pointer-events: none; }
.bg.flicker canvas { animation: flicker 3.2s steps(6) infinite; }
.screen { position: absolute; inset: 0; overflow: hidden; }

/* ---- ピクセルの部品 ---- */
.px-btn { cursor: pointer; border: 3px solid #2b2a3a; box-shadow: 3px 3px 0 #1e1d2a; background: #fbf9f2; color: #2b2a3a; min-height: 44px; min-width: 44px; padding: 0 12px; font-size: calc(var(--fs) * clamp(13px, 2.2vh, 22px)); }
.px-btn:active, .key:active, .choice-btn:active, .blank-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #1e1d2a; }
.px-btn[disabled] { cursor: default; opacity: 0.55; }
.outline-text { text-shadow: 2px 2px 0 #1e1d2a, -1px -1px 0 #1e1d2a, 1px -1px 0 #1e1d2a, -1px 1px 0 #1e1d2a; }
.sprite { display: block; }
.walker-anim { animation: walk 0.5s steps(2) infinite; }
.bob { animation: bob 2.6s steps(5) infinite; }

/* ---- 上の帯（問題・解説・やり直し・結果で共通） ---- */
.q-layout { position: absolute; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 1.2vh; padding: 1.4vh 2vw max(2.4vh, 16px); }
.q-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 2vw; color: #fbf9f2; min-width: 0; }
.q-head-left { display: flex; align-items: center; gap: 1.2vw; min-width: 0; }
.back-btn { cursor: pointer; color: #fbf9f2; font-size: clamp(13px, 2vh, 20px); background: #1f2740; border: 2px solid #fbf9f2; box-shadow: 3px 3px 0 #1e1d2a; padding: 2px 10px; white-space: nowrap; min-width: 44px; min-height: 44px; }
.back-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #1e1d2a; }
.floor-label { font-size: clamp(22px, 3.8vh, 38px); color: #ffd37c; white-space: nowrap; }
.head-tag { font-size: calc(var(--fs) * clamp(16px, 2.8vh, 28px)); background: #2f3f75; border: 3px solid #fbf9f2; box-shadow: 4px 4px 0 #1e1d2a; padding: 2px 14px; white-space: nowrap; color: #fbf9f2; }
.q-head-right { display: flex; gap: 1vw; align-items: flex-end; min-width: 0; }
.road { --sw: var(--stone-w); position: relative; display: flex; padding-top: clamp(26px, 4.6vh, 44px); }
.road .stone { width: var(--sw); height: clamp(15px, 2.3vh, 18px); border: 2px solid #1e1d2a; margin-left: -2px; display: flex; align-items: center; justify-content: center; font-size: 11px; line-height: 1; color: #1f2740; background: #8c877a; }
.road .walker { position: absolute; bottom: clamp(13px, 2.1vh, 16px); transition: left 0.6s steps(6); width: var(--sw); display: flex; justify-content: center; }
.q-count { font-size: clamp(14px, 2.4vh, 24px); color: #fbf9f2; white-space: nowrap; text-shadow: 2px 2px 0 #1e1d2a; padding-bottom: 2px; }

.q-body { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 2vw; min-height: 0; }
.q-body.explain-body { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
.q-body.dungeon-body { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); }
#app.keypad-left .q-body > .q-right { order: -1; }
#app.keypad-left .q-body { grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); }
#app.keypad-left .q-body.explain-body { grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); }
#app.keypad-left .q-body.dungeon-body { grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); }
.q-left { display: flex; flex-direction: column; gap: 1vh; min-height: 0; min-width: 0; }
.q-right { display: flex; flex-direction: column; gap: 1.2vh; min-height: 0; min-width: 0; }

/* ---- 番人と ふきだし ---- */
.speaker-row { display: flex; gap: 1vw; align-items: flex-start; }
.guard-box { flex-shrink: 0; width: auto; min-width: clamp(58px, 6.4vh, 74px); max-width: 112px; background: #1f2740; border: 3px solid #fbf9f2; box-shadow: 4px 4px 0 #1e1d2a; padding: 0.5vh 0.2vw; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 2px; }
.guard-box.light { background: #fbf9f2; border-color: #2b2a3a; }
.guard-box.dark { background: #1a1c28; border-color: #5a5468; box-shadow: 4px 4px 0 #06070c; }
.guard-box .sprite-slot { height: clamp(44px, 6.2vh, 58px); display: flex; align-items: flex-end; justify-content: center; }
.guard-name { font-size: clamp(11px, 1.4vh, 12px); color: #c9c3b3; text-align: center; line-height: 1.15; max-width: 100%; word-break: keep-all; overflow-wrap: break-word; }
.guard-box.light .guard-name { color: #8c877a; }
.guard-box.dark .guard-name { color: #a8a1b8; }
.bubble { position: relative; flex: 1; min-width: 0; background: #fbf9f2; border: 3px solid #2b2a3a; box-shadow: 4px 4px 0 #1e1d2a; padding: 1vh 1.4vw; font-size: calc(var(--fs) * clamp(17px, 2.8vh, 28px)); line-height: 1.4; color: #2b2a3a; word-break: keep-all; overflow-wrap: anywhere; }
.bubble::before { content: ''; position: absolute; left: -12px; top: 18px; width: 0; height: 0; border-top: 10px solid transparent; border-bottom: 10px solid transparent; border-right: 12px solid #2b2a3a; }
.bubble::after { content: ''; position: absolute; left: -8px; top: 20px; width: 0; height: 0; border-top: 8px solid transparent; border-bottom: 8px solid transparent; border-right: 9px solid #fbf9f2; }
.bubble.stone { background: #d9d2c4; border-color: #06070c; box-shadow: 4px 4px 0 #06070c; color: #1a1c28; }
.bubble.stone::before { border-right-color: #06070c; }
.bubble.stone::after { border-right-color: #d9d2c4; }
.bubble.long { font-size: calc(var(--fs) * clamp(15px, 2.4vh, 24px)); }
.bubble.xlong { font-size: calc(var(--fs) * clamp(14px, 2.15vh, 22px)); }
.explain-body .bubble { line-height: 1.45; word-break: keep-all; }
.explain-body .bubble:not(.long):not(.xlong) { font-size: calc(var(--fs) * clamp(17px, 2.9vh, 29px)); }
.bubble .tags { display: flex; gap: 10px; align-items: center; margin-bottom: 0.3vh; flex-wrap: wrap; }
.tag { color: #fbf9f2; padding: 1px 10px; font-size: clamp(11px, 1.7vh, 16px); background: #e2584c; white-space: nowrap; }
.tag.kind { background: #3a5fb0; }
.tag.surprise { background: #7b60a9; }
.tag.carry { background: #c2661f; }
.tag.maze { background: #3f2a6b; color: #d9d2c4; }
.tag-note { font-size: clamp(11px, 1.7vh, 16px); color: #8c877a; }
.bubble.stone .tag-note { color: #4a4560; }
.peer { display: block; margin-top: 0.5vh; background: #fff3c4; border: 2px solid #c2661f; padding: 2px 10px; font-size: 0.9em; }
.step-ask { display: block; margin-top: 0.4vh; color: #c2661f; }
.say-help { color: #7b60a9; }
.say-reveal { color: #c9402f; }
.say-ok { color: #3d6a55; }
.say-part { white-space: nowrap; }
.side-btn { flex-shrink: 0; align-self: stretch; cursor: pointer; font-size: calc(var(--fs) * clamp(12px, 2vh, 20px)); min-height: 44px; padding: 0 12px; border: 3px solid #2b2a3a; box-shadow: 3px 3px 0 #1e1d2a; background: #4a4860; color: #cfd6e6; max-width: clamp(72px, 9vw, 120px); line-height: 1.2; }
.side-btn.on { background: #ffd37c; color: #2b2a3a; }
.side-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #1e1d2a; }

/* ---- 板（方眼） ---- */
.board-wrap { position: relative; flex: 1; min-height: 0; background: #f6efd9; border: 3px solid #2b2a3a; box-shadow: 4px 4px 0 #1e1d2a; overflow: hidden; }
.board-wrap.ok { border-color: #3d6a55; animation: okflash 0.6s steps(3) both; }
.board-wrap.ng { border-color: #8a2a1e; animation: shake 0.3s steps(2) 2; }
.board-wrap.redo { border-color: #8a2a1e; box-shadow: 4px 4px 0 #1e1d2a, inset 0 0 0 3px #e2584c; }
.board-wrap.dark { box-shadow: 4px 4px 0 #06070c; }
.board { position: absolute; inset: 0; }
.board-svg { position: absolute; inset: 0; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
.board-text { font-family: 'DotGothic16', 'BIZ UDGothic', sans-serif; paint-order: stroke; stroke: #f6efd9; stroke-width: 6px; stroke-linejoin: round; shape-rendering: auto; }
.board-tag .board-text, .board-hidden .board-text { stroke: none; }
.board-lines .cut-line { animation: cutin 0.25s steps(3); }
.stamp-layer { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 4; }
.stamp { animation: stampin 0.35s steps(5) both; width: clamp(90px, 16vh, 170px); height: clamp(90px, 16vh, 170px); border: 6px solid; font-size: clamp(56px, 10vh, 110px); line-height: 1; display: flex; align-items: center; justify-content: center; box-shadow: 6px 6px 0 rgba(30, 29, 42, 0.35); }
.stamp.ok { border-color: #3d6a55; color: #3d6a55; background: rgba(231, 243, 228, 0.92); }
.stamp.ng { border-color: #c9402f; color: #c9402f; background: rgba(251, 249, 242, 0.92); }
.spark { position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; border: 2px solid #2b2a3a; pointer-events: none; z-index: 4; animation: sparkle 0.6s steps(4) both; }
.fb-band { z-index: 5; animation: slamup 0.2s steps(3) both; position: absolute; left: 0; right: 0; bottom: 0; color: #fbf9f2; border-top: 3px solid #2b2a3a; padding: 1vh 1.6vw; display: flex; align-items: center; gap: 1.4vw; background: #3d6a55; }
.fb-band.ng { background: #8a2a1e; }
.fb-band.dark-ok { background: #2f6a55; border-top-color: #06070c; }
.fb-title { font-size: calc(var(--fs) * clamp(20px, 3.6vh, 36px)); white-space: nowrap; flex-shrink: 0; }
.fb-text { font-size: calc(var(--fs) * clamp(18px, 3.2vh, 32px)); min-width: 0; line-height: 1.35; }
.fb-text.small { font-size: calc(var(--fs) * clamp(15px, 2.5vh, 25px)); }
.board-note { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 3vh 3vw; font-size: calc(var(--fs) * clamp(18px, 3.6vh, 36px)); line-height: 1.6; text-align: center; color: #2b2a3a; }
.board-note.dark { color: #1a1c28; }
.board-msg { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: #1f2740; color: #fbf9f2; border: 3px solid #fbf9f2; padding: 2px 12px; font-size: calc(var(--fs) * clamp(12px, 2vh, 20px)); z-index: 6; pointer-events: none; white-space: normal; width: max-content; max-width: 92%; text-align: center; line-height: 1.35; animation: fadein 0.2s steps(3); }

/* ---- 答えの入力 ---- */
.col-label { font-size: calc(var(--fs) * clamp(14px, 2.4vh, 24px)); color: #fbf9f2; text-shadow: 2px 2px 0 #1e1d2a; }
.num-display { display: flex; align-items: center; background: #fbf9f2; border: 3px solid #2b2a3a; box-shadow: 4px 4px 0 #1e1d2a; min-height: 64px; flex-shrink: 0; }
.num-display .val { flex: 1; text-align: right; padding: 0 1.2vw; font-size: clamp(30px, 6vh, 60px); line-height: 1; color: #2b2a3a; }
.num-display .val.empty { color: #c9c3b3; }
.num-display .val.ok { color: #3d6a55; }
.num-display .val.ng { color: #c9402f; }
.num-display .unit { padding: 0 1.2vw; font-size: clamp(16px, 2.8vh, 28px); color: #8c877a; border-left: 3px solid #2b2a3a; align-self: stretch; display: flex; align-items: center; white-space: nowrap; }
.num-display.dark { background: #1a1c28; border-color: #5a5468; box-shadow: 4px 4px 0 #06070c; }
.num-display.dark .val { color: #d9d2c4; }
.num-display.dark .val.empty { color: #5a5468; }
.num-display.dark .unit { color: #6f6a80; border-left-color: #5a5468; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8vh; flex: 1; min-height: 0; }
.keypad.short { flex: 0 1 auto; grid-auto-rows: minmax(44px, 7vh); }
.key { cursor: pointer; font-size: clamp(20px, 3.6vh, 36px); line-height: 1; padding: 0; min-height: 44px; border: 3px solid #2b2a3a; box-shadow: 3px 3px 0 #1e1d2a; background: #fbf9f2; color: #2b2a3a; }
.key.fn-clear { background: #6e6b85; color: #fbf9f2; font-size: calc(var(--fs) * clamp(15px, 2.6vh, 26px)); }
.key.fn-back { background: #8c877a; color: #fbf9f2; }
.keypad.dark .key { border-color: #12131c; box-shadow: 3px 3px 0 #06070c; background: #d9d2c4; color: #171926; }
.keypad.dark .key.fn-clear { background: #3a3c4c; color: #d9d2c4; }
.keypad.dark .key.fn-back { background: #4a4c60; color: #d9d2c4; }
.answer-btn { cursor: pointer; font-size: calc(var(--fs) * clamp(22px, 4vh, 40px)); min-height: 64px; padding: 1.2vh; border: 3px solid #fbf9f2; box-shadow: 5px 5px 0 #1e1d2a; background: #ffd37c; color: #2b2a3a; flex-shrink: 0; }
.answer-btn:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 #1e1d2a; }
.answer-btn.disabled { background: #4a4860; color: #cfd6e6; cursor: default; }
.answer-btn.next { background: #f4a23c; }
.answer-btn.again { background: #e2584c; color: #fbf9f2; }
.answer-btn.dark { border-color: #9ad7c4; box-shadow: 5px 5px 0 #06070c; background: #9ad7c4; color: #12131c; }
.answer-btn.dark.disabled { background: #4a4c60; color: #cfd6e6; }
.answer-btn.dark.next { background: #3d8f74; }
.answer-btn.wait { background: #4a4860; color: #cfd6e6; border-color: #6e6b85; cursor: default; }
.btn-row2 { display: grid; grid-template-columns: 1fr 1.6fr; gap: 1vw; flex-shrink: 0; }
.btn-row2 .answer-btn { font-size: calc(var(--fs) * clamp(16px, 2.8vh, 28px)); }

/* 選択 */
/* 選択肢は 右の列の あいている高さまで 大きくする（本人の指定 2026-09-15） */
.choices { display: flex; flex-direction: column; gap: 1.2vh; flex: 1; min-height: 0; }
.choice-btn { text-align: left; cursor: pointer; font-size: calc(var(--fs) * clamp(18px, 3.4vh, 34px)); line-height: 1.35; padding: 1.4vh 1.4vw; border: 3px solid #2b2a3a; box-shadow: 4px 4px 0 #1e1d2a; background: #fbf9f2; color: #2b2a3a; display: flex; gap: 1.2vw; align-items: center; min-height: 64px; flex: 1 1 0; max-height: 150px; }
.choices.many .choice-btn { min-height: 48px; padding: 0.8vh 1.1vw; font-size: calc(var(--fs) * clamp(15px, 2.7vh, 27px)); line-height: 1.3; }
.choices.long .choice-btn { font-size: calc(var(--fs) * clamp(15px, 2.7vh, 27px)); line-height: 1.3; }
.choice-btn .num { width: clamp(32px, 5.6vh, 50px); height: clamp(32px, 5.6vh, 50px); flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 3px solid #2b2a3a; background: #3a4c8a; color: #fbf9f2; font-size: clamp(15px, 2.7vh, 26px); }
.choices.tight { gap: 0.6vh; }
.choices.tight .choice-btn { min-height: 40px; padding: 0.4vh 0.9vw; font-size: calc(var(--fs) * clamp(13px, 2vh, 20px)); line-height: 1.25; box-shadow: 3px 3px 0 #1e1d2a; }
.choices.tight .choice-btn .num { width: clamp(24px, 3.6vh, 34px); height: clamp(24px, 3.6vh, 34px); font-size: clamp(12px, 1.9vh, 18px); }
.choice-btn.sel { background: #ffd37c; }
.choice-btn.sel .num { background: #c2661f; }
.choice-btn.right { background: #6cbd6f; }
.choice-btn.right .num { background: #3d6a55; }
.choice-btn.wrong { background: #e2584c; color: #fbf9f2; }
.choice-btn.wrong .num { background: #8a2a1e; }
.choice-btn.dark { border-color: #06070c; box-shadow: 4px 4px 0 #06070c; background: #d9d2c4; }

/* あなうめの行（解説・複数の欄） */
.fill-rows { display: flex; flex-direction: column; gap: 1vh; flex-shrink: 0; }
.fill-row { display: flex; align-items: center; gap: 0.6vw; padding: 0.8vh 1vw; border: 3px solid #8c877a; background: #fbf9f2; min-height: 56px; flex-wrap: wrap; row-gap: 0.4vh; }
.fill-row.done { background: #e7f3e4; border-color: #3d6a55; color: #2b4a38; }
.fill-row.active { border-color: #c2661f; box-shadow: 4px 4px 0 #1e1d2a; }
.fill-row.todo { background: rgba(251, 249, 242, 0.78); color: #6e6a5c; }
.fill-row .chip { width: clamp(16px, 2.2vh, 22px); height: clamp(16px, 2.2vh, 22px); border: 2px solid #2b2a3a; display: block; flex-shrink: 0; background: #ffd37c; }
.fill-row .row-label { font-size: calc(var(--fs) * clamp(15px, 2.6vh, 26px)); min-width: clamp(44px, 6vh, 74px); flex-shrink: 0; }
.fill-part { font-size: calc(var(--fs) * clamp(16px, 2.8vh, 28px)); line-height: 1.1; }
.fill-row .mark { margin-left: auto; font-size: clamp(18px, 3vh, 30px); color: #3d6a55; flex-shrink: 0; }
.blank-btn { cursor: pointer; font-size: calc(var(--fs) * clamp(17px, 3vh, 30px)); line-height: 1; min-width: clamp(48px, 6.4vh, 64px); min-height: clamp(44px, 5vh, 48px); padding: 0 6px; border: 3px solid #8c877a; background: #fbf9f2; color: #2b2a3a; }
.blank-btn.on { border-color: #f4a23c; background: #fff3c4; box-shadow: 3px 3px 0 #1e1d2a; }
.blank-btn.ok { border-color: #3d6a55; background: #e7f3e4; color: #2b4a38; cursor: default; }
.blank-btn.ng { border-color: #c9402f; background: #f7dcd8; color: #8a2a1e; animation: shake 0.3s steps(2) 1; }
.blank-btn.wait { border-style: dashed; color: #8c877a; cursor: default; background: transparent; }
.blank-unit { font-size: calc(var(--fs) * clamp(13px, 2.2vh, 22px)); color: #6e6a5c; }
/* わくや すきまを つけると せまい 画面で 行が あふれるので、色だけで 分ける */
.blank-unit.area { color: #1d3566; background: #d9e8ff; }
.blank-unit.len { color: #7a3f0f; background: #ffe9d2; }
/* 聞かれているのが 面積か 長さかを はっきり 出す 札 */
.ask-tag { align-self: flex-start; padding: 0.3vh 12px; border: 3px solid #2b2a3a; background: #fbf9f2; color: #2b2a3a; box-shadow: 3px 3px 0 #1e1d2a; font-size: calc(var(--fs) * clamp(14px, 2.3vh, 23px)); flex-shrink: 0; }
.ask-tag.area { background: #d9e8ff; border-color: #2f5fa8; color: #1d3566; }
.ask-tag.len { background: #ffe9d2; border-color: #c2661f; color: #7a3f0f; }
.num-display .unit.area { background: #d9e8ff; color: #1d3566; }
.num-display .unit.len { background: #ffe9d2; color: #7a3f0f; }

/* ならべる */
.order-list { display: flex; flex-direction: column; gap: 0.9vh; flex: 1; min-height: 0; }
.order-item { display: flex; align-items: center; gap: 0.8vw; background: #fbf9f2; border: 3px solid #2b2a3a; box-shadow: 3px 3px 0 #1e1d2a; padding: 0.4vh 0.8vw; font-size: calc(var(--fs) * clamp(15px, 2.6vh, 26px)); flex: 1; min-height: 44px; max-height: 76px; }
.order-item .n { width: clamp(26px, 4vh, 38px); height: clamp(26px, 4vh, 38px); display: flex; align-items: center; justify-content: center; border: 3px solid #2b2a3a; background: #3a4c8a; color: #fbf9f2; font-size: clamp(13px, 2.2vh, 20px); flex-shrink: 0; }
.order-item .t { flex: 1; min-width: 0; }
.order-item .px-btn { padding: 0 8px; }
.order-ends { display: flex; justify-content: space-between; font-size: calc(var(--fs) * clamp(12px, 2vh, 19px)); color: #fbf9f2; text-shadow: 2px 2px 0 #1e1d2a; }

/* ペア */
.pairs-found { display: flex; flex-wrap: wrap; gap: 0.6vw; min-height: 34px; }
.pair-chip { background: #6cbd6f; border: 3px solid #2b2a3a; padding: 2px 10px; font-size: calc(var(--fs) * clamp(14px, 2.4vh, 24px)); }
.pair-add { background: #3a5fb0; color: #fbf9f2; }

/* 筆算（マス目） */
.hissan-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1vh; padding: 1vh; }
.hissan-title { font-size: calc(var(--fs) * clamp(14px, 2.4vh, 24px)); background: #1f2740; color: #fbf9f2; border: 3px solid #2b2a3a; padding: 2px 12px; }
.hs { display: inline-flex; flex-direction: column; background: #fbf9f2; border: 3px solid #2b2a3a; box-shadow: 4px 4px 0 #1e1d2a; padding: 8px 10px; --cell: clamp(28px, 5.2vh, 46px); }
.hs-row { display: flex; }
.hs-cell { position: relative; width: var(--cell); height: var(--cell); border: 1px dashed #d9c9a0; display: flex; align-items: center; justify-content: center; font-size: calc(var(--cell) * 0.7); color: #2b2a3a; }
.hs-cell.done { color: #3d6a55; }
.hs-cell.active { background: #ffe66d; border: 3px solid #f4a23c; color: #2b2a3a; }
.hs-carry { position: absolute; top: -2px; right: 2px; font-style: normal; font-size: calc(var(--cell) * 0.34); color: #c9402f; }
.hs-divider .hs-line { width: var(--cell); height: 4px; }
.hs-divider .hs-line.on { background: #2b2a3a; }
.hs-divisor { justify-content: flex-end; padding-right: 6px; border: none; border-right: 3px solid #2b2a3a; }
.hs-divisor-pad { border: none; }
.hs-quotient { border-bottom: 3px solid #2b2a3a; }
.hs-ask { font-size: calc(var(--fs) * clamp(15px, 2.6vh, 26px)); color: #2b2a3a; background: #fff3c4; border: 3px solid #c2661f; padding: 2px 12px; }

/* ---- 解説（天使ちゃん） ---- */
.ya-pill { display: flex; align-items: center; gap: 8px; background: #8a2a1e; border: 3px solid #fbf9f2; box-shadow: 4px 4px 0 #1e1d2a; padding: 2px 14px; color: #fbf9f2; min-width: 0; max-width: 46vw; }
.ya-pill .l { font-size: clamp(11px, 1.8vh, 17px); white-space: nowrap; }
.ya-pill .v { font-size: calc(var(--fs) * clamp(15px, 2.7vh, 30px)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.ya-pill.strike .v { text-decoration: line-through; }
.ya-pill.small { border-color: #2b2a3a; box-shadow: 3px 3px 0 #1e1d2a; padding: 2px 12px; }
.ya-row { display: flex; justify-content: flex-end; }

/* ---- やり直しモード ---- */
.redo-frame { position: absolute; inset: 0; pointer-events: none; z-index: 4; border: 8px solid #8a2a1e; box-shadow: inset 0 0 0 3px #1e1d2a; }
.redo-stripe { position: absolute; left: 0; right: 0; height: 14px; pointer-events: none; z-index: 5; background: repeating-linear-gradient(135deg, #8a2a1e 0 10px, #ffd37c 10px 20px); }
.redo-stripe.top { top: 0; border-bottom: 3px solid #1e1d2a; }
.redo-stripe.bottom { bottom: 0; border-top: 3px solid #1e1d2a; }
.q-layout.redo-layout { padding: calc(1.4vh + 14px) calc(2vw + 8px) calc(2vh + 14px); }
.redo-tag { display: flex; align-items: center; gap: 8px; font-size: calc(var(--fs) * clamp(18px, 3.2vh, 32px)); background: #8a2a1e; border: 3px solid #fbf9f2; box-shadow: 4px 4px 0 #1e1d2a; padding: 2px 14px; white-space: nowrap; color: #fbf9f2; }
.redo-tag .stripe-chip { width: clamp(14px, 2.2vh, 22px); height: clamp(14px, 2.2vh, 22px); background: repeating-linear-gradient(135deg, #ffd37c 0 4px, #8a2a1e 4px 8px); border: 2px solid #fbf9f2; display: block; }
.redo-note { font-size: calc(var(--fs) * clamp(11px, 1.8vh, 17px)); color: #ffd37c; white-space: nowrap; text-shadow: 2px 2px 0 #1e1d2a; }
.redo-marks { display: flex; gap: 0.6vw; align-items: center; }
.redo-marks .m { width: clamp(22px, 3.4vh, 34px); height: clamp(22px, 3.4vh, 34px); border: 3px solid #1e1d2a; display: flex; align-items: center; justify-content: center; font-size: clamp(12px, 2vh, 20px); color: #1f2740; background: #8c877a; }
.redo-marks .m.done { background: #6cbd6f; }
.redo-marks .m.now { background: #ffd37c; }

/* ---- 結果 ---- */
.result-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 2vw; min-height: 0; }
.result-body .q-right { gap: 0.6vh; }
.score-card { background: #fbf9f2; border: 3px solid #2b2a3a; box-shadow: 5px 5px 0 #1e1d2a; padding: 1.4vh 1.4vw; display: flex; flex-direction: column; align-items: center; gap: 0.6vh; animation: pop 0.35s steps(5) both; }
.score-card .lab { font-size: calc(var(--fs) * clamp(13px, 2.2vh, 22px)); color: #8c877a; }
.score-num { font-size: clamp(52px, 11vh, 120px); line-height: 1.1; color: #2b2a3a; }
.score-den { font-size: clamp(20px, 3.4vh, 34px); color: #8c877a; }
.mark-row { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
.mark-sq { width: clamp(20px, 3.2vh, 32px); height: clamp(20px, 3.2vh, 32px); border: 3px solid #2b2a3a; display: flex; align-items: center; justify-content: center; font-size: clamp(12px, 1.9vh, 18px); color: #fbf9f2; background: #6cbd6f; }
.mark-sq.ng { background: #e2584c; }
.gate-card { display: flex; align-items: center; gap: 1vw; background: #1f2740; border: 3px solid #fbf9f2; box-shadow: 4px 4px 0 #1e1d2a; padding: 0.8vh 1vw; color: #fbf9f2; }
.gate-card .l { font-size: calc(var(--fs) * clamp(12px, 1.9vh, 18px)); color: #c9c3b3; }
.gate-card .v { font-size: calc(var(--fs) * clamp(18px, 3.2vh, 32px)); }
.todo-card { flex: 1; min-height: 0; background: #fbf9f2; border: 3px solid #2b2a3a; box-shadow: 5px 5px 0 #1e1d2a; padding: 1vh 1.2vw; display: flex; flex-direction: column; gap: 0.6vh; overflow: hidden; }
.todo-card .l { font-size: calc(var(--fs) * clamp(12px, 1.9vh, 18px)); color: #8c877a; }
.todo-list { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-auto-rows: minmax(0, 48px); gap: 0.6vh 0.8vw; align-content: start; }
.todo-list.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.todo-row { display: flex; align-items: center; gap: 0.8vw; border: 3px solid #c2661f; background: #fff3c4; padding: 0 0.8vw; min-height: 0; overflow: hidden; }
.todo-row .n { width: auto; min-width: clamp(28px, 3.6vh, 40px); height: clamp(24px, 3.2vh, 32px); border: 2px solid #2b2a3a; background: #c2661f; color: #fbf9f2; display: flex; align-items: center; justify-content: center; font-size: clamp(12px, 1.9vh, 18px); flex-shrink: 0; padding: 0 4px; }
.todo-row .t { font-size: calc(var(--fs) * clamp(14px, 2.4vh, 24px)); color: #2b2a3a; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.todo-row .k { margin-left: auto; font-size: calc(var(--fs) * clamp(11px, 1.8vh, 17px)); color: #8c877a; white-space: nowrap; flex-shrink: 0; }
.res-list { display: flex; flex-direction: column; gap: 0.5vh; flex: 1; min-height: 0; }
.res-row { display: flex; align-items: center; gap: 0.8vw; padding: 0 0.8vw; border: 3px solid #2b2a3a; background: #fbf9f2; flex: 1; min-height: 0; max-height: 58px; }
.res-row.ng { background: #f7dcd8; }
.res-row .n { width: clamp(22px, 3vh, 30px); font-size: clamp(12px, 2vh, 19px); color: #8c877a; flex-shrink: 0; }
.res-row .g { width: clamp(22px, 3vh, 30px); height: clamp(22px, 3vh, 30px); border: 3px solid #2b2a3a; background: #6cbd6f; color: #fbf9f2; display: flex; align-items: center; justify-content: center; font-size: clamp(12px, 1.9vh, 18px); flex-shrink: 0; }
.res-row.ng .g { background: #e2584c; }
.res-row .t { flex: 1; font-size: calc(var(--fs) * clamp(13px, 2.2vh, 22px)); color: #2b2a3a; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res-row .tg { font-size: clamp(11px, 1.8vh, 17px); padding: 0 8px; flex-shrink: 0; color: #fbf9f2; }
.res-row .tg.gate { background: #8a2a1e; }
.res-row .tg.redo { background: #c2661f; }
.res-actions { display: grid; grid-template-columns: 2fr 1fr; gap: 0.8vw; flex-shrink: 0; }
.big-btn { cursor: pointer; font-size: calc(var(--fs) * clamp(18px, 3.4vh, 34px)); min-height: 64px; border: 3px solid #fbf9f2; box-shadow: 5px 5px 0 #1e1d2a; background: #f4a23c; color: #2b2a3a; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 0.6vw; gap: 0.8vw; }
.big-btn:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 #1e1d2a; }
.big-btn.navy { background: #1f2740; color: #fbf9f2; font-size: calc(var(--fs) * clamp(14px, 2.6vh, 26px)); }
.big-btn.purple { background: #7b60a9; color: #fbf9f2; }
.big-btn.red { background: #8a2a1e; color: #fbf9f2; border-color: #ffd37c; }
.big-btn.blue { background: #2f86d8; color: #ffffff; border-color: #cfe4ff; }
.tri { width: 0; height: 0; border-top: 1.1vh solid transparent; border-bottom: 1.1vh solid transparent; border-left: 1.6vh solid currentColor; display: block; flex-shrink: 0; }

/* ---- クリア・まちがい直しのあと ---- */
.outcome { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.2vh; padding: 3vh 4vw; }
.outcome-title { font-size: clamp(40px, min(9vh, 10vw), 96px); line-height: 1; color: #ffd37c; text-shadow: 4px 4px 0 #8a2a1e, -3px -3px 0 #2b2a3a, 3px -3px 0 #2b2a3a, -3px 3px 0 #2b2a3a, 3px 3px 0 #2b2a3a, 0 6px 0 #2b2a3a; white-space: nowrap; animation: pop 0.5s steps(6) both; }
.outcome-title.redo { color: #fbf9f2; text-shadow: 4px 4px 0 #8a2a1e, -3px -3px 0 #2b2a3a, 3px -3px 0 #2b2a3a, -3px 3px 0 #2b2a3a, 3px 3px 0 #2b2a3a; }
.outcome .speaker-row { width: min(900px, 92vw); }
.outcome-actions { display: flex; gap: 1.4vw; width: min(760px, 92vw); }
.outcome-actions .big-btn { flex: 1; }
.outcome-note { background: #f1e4c3; border: 4px solid #7a5c3a; box-shadow: 4px 4px 0 #1e1d2a; padding: 0.6vh 1.4vw; font-size: calc(var(--fs) * clamp(14px, 2.4vh, 24px)); color: #2b2a3a; }

/* ---- 導入（8階・9階の前） ---- */
.intro-counter { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); background: #1f2740; color: #ffd37c; border: 3px solid #fbf9f2; padding: 2px 12px; font-size: calc(var(--fs) * clamp(14px, 2.4vh, 24px)); white-space: nowrap; }
.intro-big { font-size: calc(var(--fs) * clamp(22px, 4vh, 44px)); color: #2b2a3a; background: #fff3c4; border: 3px solid #2b2a3a; box-shadow: 4px 4px 0 #1e1d2a; padding: 0.6vh 1.2vw; text-align: center; }
.intro-wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.intro-svg { display: block; }
.intro-svg .intro-label { fill: #2b2a3a; font-family: 'DotGothic16', sans-serif; font-size: 20px; }
.intro-svg .intro-label.small { font-size: 16px; fill: #8a2a1e; }
/* ほかの子の 答案（大きな カード） */
.peer-card { display: flex; align-items: center; gap: 1vw; flex-shrink: 0; background: #fff3c4; border: 3px solid #c2661f; box-shadow: 4px 4px 0 #1e1d2a; padding: 0.6vh 1vw; min-width: 0; }
.peer-card .hd { flex-shrink: 0; background: #c2661f; color: #fbf9f2; padding: 1px 10px; font-size: calc(var(--fs) * clamp(12px, 1.9vh, 18px)); white-space: nowrap; }
.peer-card .tx { font-size: calc(var(--fs) * clamp(18px, 3.3vh, 32px)); color: #2b2a3a; min-width: 0; overflow-wrap: anywhere; line-height: 1.3; }
.peer-card.dark { background: #d9d2c4; border-color: #8a6a3a; box-shadow: 4px 4px 0 #06070c; }

/* ---- ホーム ---- */
.plaque { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; color: #f1e4c3; font-size: 1.2cqw; text-align: center; white-space: nowrap; pointer-events: none; }
.plaque .r { color: #ffd37c; }
.gate-sign { position: absolute; display: flex; align-items: center; justify-content: center; font-size: 1.3cqw; color: #2b2a3a; white-space: nowrap; pointer-events: none; }
.home-title { position: absolute; left: 3%; top: 4%; display: flex; flex-direction: column; gap: 1.2vh; max-width: 36%; }
.home-title .kicker { font-size: clamp(14px, 2.4vh, 28px); color: #fbf9f2; text-shadow: 2px 2px 0 #2b2a3a, -1px -1px 0 #2b2a3a, 1px -1px 0 #2b2a3a, -1px 1px 0 #2b2a3a; }
.home-title .logo { font-size: clamp(44px, 10vh, 112px); line-height: 1; color: #fbf9f2; white-space: nowrap; text-shadow: 4px 4px 0 #2b2a3a, -3px -3px 0 #2b2a3a, 3px -3px 0 #2b2a3a, -3px 3px 0 #2b2a3a, 3px 0 0 #2b2a3a, -3px 0 0 #2b2a3a, 0 3px 0 #2b2a3a, 0 -3px 0 #2b2a3a, 8px 8px 0 #2f4a8a; }
.home-title .logo .no { color: #ffd37c; }
.home-title .catch { align-self: flex-start; background: #2b2a3a; border: 3px solid #fbf9f2; box-shadow: 4px 4px 0 #1e1d2a; padding: 4px 14px; font-size: calc(var(--fs) * clamp(14px, 2.2vh, 24px)); color: #fbf9f2; }
.home-title .lead { font-size: calc(var(--fs) * clamp(13px, 2.1vh, 23px)); line-height: 1.75; color: #fbf9f2; text-shadow: 2px 2px 0 #2b2a3a, -1px -1px 0 #2b2a3a, 1px -1px 0 #2b2a3a, -1px 1px 0 #2b2a3a; margin-top: 1.4vh; }
.home-warn { align-self: flex-start; margin-top: 1vh; background: #8a2a1e; border: 3px solid #ffd37c; box-shadow: 4px 4px 0 #1e1d2a; padding: 4px 10px; color: #fbf9f2; font-size: calc(var(--fs) * clamp(12px, 1.9vh, 19px)); line-height: 1.4; }
.home-icons { position: absolute; right: 3%; top: 4%; width: 24%; display: flex; justify-content: flex-end; gap: 1.2vw; }
.icon-btn { cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; width: clamp(64px, 8vh, 90px); height: clamp(64px, 8vh, 90px); background: #1f2740; border: 3px solid #fbf9f2; box-shadow: 4px 4px 0 #1e1d2a; color: #fbf9f2; font-size: clamp(11px, 1.5vh, 15px); white-space: nowrap; padding: 0; }
.icon-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #1e1d2a; }
.icon-btn .ic-set { width: 38%; height: 38%; background: #ffd37c; box-shadow: inset 0 0 0 4px #1f2740, 0 0 0 3px #ffd37c; display: block; }
.icon-btn .ic-how { width: 44%; height: 32%; background: #fbf9f2; box-shadow: inset 0 0 0 2px #1f2740; border-left: 3px solid #1f2740; border-right: 3px solid #1f2740; display: block; }
.icon-btn .ic-book { width: 44%; height: 36%; background: #f6efd9; border: 3px solid #c2661f; box-shadow: inset 0 0 0 2px #c9402f; display: block; }
.parchment { position: absolute; right: 3%; top: calc(4% + clamp(64px, 8vh, 90px) + 3vh); width: 24%; background: #f1e4c3; border: 4px solid #7a5c3a; box-shadow: 5px 5px 0 #2b2a3a, inset 0 0 0 3px #e8dcb5; padding: 2.4vh 1.6vw 2vh; text-align: center; font-size: calc(var(--fs) * clamp(14px, 2.3vh, 26px)); line-height: 1.7; color: #2b2a3a; }
.parchment .flag { margin: 1.6vh auto 0; width: 36%; height: 3.2vh; background: #3b2e22; clip-path: polygon(50% 0, 62% 30%, 74% 22%, 100% 100%, 0 100%, 30% 35%); }
.player-card { position: absolute; left: 3%; bottom: 4%; width: 26%; background: #1f2740; border: 3px solid #fbf9f2; box-shadow: 5px 5px 0 #1e1d2a; padding: 1.6vh 1.4vw; display: flex; gap: 1.2vw; align-items: center; color: #fbf9f2; }
.player-card .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.6vh; }
.player-card .name-row { display: flex; align-items: baseline; gap: 0.6vw; min-width: 0; }
.player-card .pname { font-size: calc(var(--fs) * clamp(16px, 2.8vh, 30px)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player-card .rank { font-size: clamp(11px, 1.7vh, 17px); color: #9fc4ef; white-space: nowrap; }
.player-card .rank.master { color: #ffd37c; }
.player-card .line { font-size: calc(var(--fs) * clamp(11px, 1.7vh, 17px)); color: #c9c3b3; }
.player-card .line .theme { color: #ffd37c; }
.player-card .bar { height: 1.2vh; min-height: 8px; background: #3a4c8a; border: 2px solid #fbf9f2; }
.player-card .bar > div { height: 100%; background: #ffd37c; }
.player-card .tiers { display: flex; align-items: center; gap: 6px; }
.player-card .tiers .chips { display: flex; gap: 4px; }
.player-card .tiers .chip { width: clamp(12px, 1.9vh, 18px); height: clamp(12px, 1.9vh, 18px); border: 2px solid #1e1d2a; display: block; flex-shrink: 0; background: #3a4c8a; }

/* ---- モーダル（せってい・あそびかた・なまえ・手帳） ---- */

.modal.wide { width: min(880px, 92vw); }

.modal-title { font-size: calc(var(--fs) * clamp(18px, 3.2vh, 32px)); color: #ffd37c; }
.modal-sub { font-size: clamp(11px, 1.9vh, 18px); color: #9fc4ef; white-space: nowrap; }
.modal-close { margin-left: auto; cursor: pointer; font-size: clamp(14px, 2.4vh, 24px); min-height: 44px; min-width: 44px; background: #fbf9f2; border: 3px solid #2b2a3a; box-shadow: 3px 3px 0 #1e1d2a; color: #2b2a3a; }
.modal-body { padding: 1.2vh 1.4vw 1.6vh; display: flex; flex-direction: column; gap: 1vh; overflow: auto; }
.set-row { display: flex; align-items: center; gap: 1vw; }
.set-row .lab { min-width: 0; display: flex; flex-direction: column; }

.set-row .opts { margin-left: auto; display: flex; gap: 5px; flex-shrink: 0; }
.opt-btn { cursor: pointer; font-size: calc(var(--fs) * clamp(13px, 2.2vh, 22px)); min-height: 44px; padding: 0 14px; border: 3px solid #2b2a3a; box-shadow: 3px 3px 0 #1e1d2a; background: #fbf9f2; color: #2b2a3a; white-space: nowrap; }

.set-sep { height: 3px; background: #c9c3b3; }
.danger-text { font-size: calc(var(--fs) * clamp(13px, 2.2vh, 22px)); color: #8a2a1e; min-width: 0; }
.how-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.2vw; }
.how-card { display: flex; flex-direction: column; gap: 0.6vh; background: #fbf9f2; border: 3px solid #2b2a3a; box-shadow: 4px 4px 0 #1e1d2a; padding: 0.8vh 0.8vw; }

/* あそびかた（はじめては 自動で 出す。大きく） */

/* ---- 屋上 ---- */
.roof-chest { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 3vh 3vw; }

.roof-chest .guard-box { width: clamp(58px, 7vh, 80px); }
.roof-chest .bubble { padding: 1.2vh 1.6vw; font-size: calc(var(--fs) * clamp(18px, 3.2vh, 32px)); line-height: 1.45; }
.roof-view { position: absolute; inset: 0; padding: 2.4vh 3vw 3vh; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); grid-template-rows: auto minmax(0, 1fr) auto; gap: 2vh 2.4vw; align-items: start; }
.roof-banner { grid-column: 1 / 3; display: flex; flex-direction: column; align-items: center; gap: 0.8vh; animation: pop 0.5s steps(6) both; }
.ribbon { display: flex; align-items: stretch; filter: drop-shadow(5px 5px 0 #1e1d2a); }
.ribbon .end-l { width: 0; height: 0; border-top: clamp(22px, 4vh, 40px) solid transparent; border-bottom: clamp(22px, 4vh, 40px) solid transparent; border-right: clamp(16px, 2.6vw, 30px) solid #6b1a12; }
.ribbon .end-r { width: 0; height: 0; border-top: clamp(22px, 4vh, 40px) solid transparent; border-bottom: clamp(22px, 4vh, 40px) solid transparent; border-left: clamp(16px, 2.6vw, 30px) solid #6b1a12; }
.ribbon .mid { display: flex; align-items: center; gap: 0.8vw; background: #8a2a1e; border-top: 4px solid #ffd37c; border-bottom: 4px solid #ffd37c; padding: 0.4vh 2vw; font-size: calc(var(--fs) * clamp(20px, 3.8vh, 38px)); color: #fbf9f2; white-space: nowrap; }

.mastery { grid-column: 1 / 2; grid-row: 3 / 4; align-self: end; justify-self: start; background: #f1e4c3; border: 4px solid #7a5c3a; box-shadow: 4px 4px 0 #1e1d2a; padding: 0.6vh 1.2vw; color: #2b2a3a; max-width: 100%; }
.mastery .hd { font-size: calc(var(--fs) * clamp(13px, 2.2vh, 22px)); color: #8a2a1e; }
.mastery .ln { font-size: calc(var(--fs) * clamp(11px, 1.85vh, 18px)); line-height: 1.45; }

/* ---- 地下 ---- */
.dungeon-tint { background: radial-gradient(ellipse at 42% 48%, rgba(255, 179, 71, 0.08) 0%, rgba(20, 28, 42, 0) 46%), radial-gradient(ellipse at 50% 50%, rgba(20, 28, 42, 0) 40%, rgba(20, 28, 42, 0.22) 78%, rgba(16, 22, 34, 0.4) 100%); }
.q-layout.dungeon-layout { padding: 2vh 7vw 3vh; }
.dungeon-depth { font-size: clamp(22px, 3.8vh, 38px); color: #9ad7c4; white-space: nowrap; text-shadow: 2px 2px 0 #06070c; }
.dungeon-sub { font-size: calc(var(--fs) * clamp(12px, 2vh, 19px)); color: #c9c0aa; white-space: nowrap; text-shadow: 2px 2px 0 #06070c; }
.back-btn.dark { color: #d9d2c4; background: #1a1c28; border-color: #5a5468; box-shadow: 3px 3px 0 #06070c; }

.dc-banner .crown { color: #e6c88a; font-size: clamp(11px, 1.6vh, 15px); }
.dc-banner .vt { writing-mode: vertical-rl; font-size: calc(var(--fs) * clamp(11px, 1.9vh, 18px)); line-height: 1.45; color: #e0cfa4; letter-spacing: 0.05em; padding-bottom: 1.6vh; }
.dc-head { position: absolute; left: 50%; top: 3.2vh; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 0.4vh; animation: fadein 0.5s steps(6) both; }
.dc-head .k { display: flex; align-items: center; gap: 0.7vw; font-size: calc(var(--fs) * clamp(18px, 3.4vh, 36px)); color: #f2efe6; white-space: nowrap; text-shadow: 3px 3px 0 #06070c; }

.dc-head .big { position: relative; font-size: clamp(46px, 11.5vh, 132px); line-height: 1; color: #ffd37c; white-space: nowrap; letter-spacing: 0.02em; text-shadow: 0 7px 0 #b4541a, 6px 7px 0 #b4541a, -6px 7px 0 #b4541a, -5px -5px 0 #1e1d2a, 5px -5px 0 #1e1d2a, -5px 5px 0 #1e1d2a, 5px 5px 0 #1e1d2a, 0 12px 0 #1e1d2a; }
.dc-head .lead { font-size: calc(var(--fs) * clamp(13px, 2.4vh, 24px)); line-height: 1.55; color: #f2efe6; text-align: center; text-shadow: 2px 2px 0 #06070c, -2px -2px 0 #06070c, 2px -2px 0 #06070c, -2px 2px 0 #06070c, 0 3px 0 #06070c; margin-top: 0.6vh; }

.sparkle { position: absolute; background: #fff3c4; box-shadow: 0 0 0 3px #f4a23c; animation: twinkle 1.3s steps(2) infinite; }
.dc-card { position: absolute; right: 1.6vw; top: 2vh; width: clamp(230px, 27vw, 360px); background: #efe0bd; border: 4px solid #8a6a3a; box-shadow: 5px 5px 0 rgba(6, 7, 12, 0.7), inset 0 0 0 3px #dccba0; }
.dc-card .hd { background: #5a4a2e; color: #efe0bd; font-size: calc(var(--fs) * clamp(13px, 2.2vh, 22px)); padding: 0.2vh 0.7vw; }

.dc-card .ttl { text-align: center; font-size: calc(var(--fs) * clamp(15px, 2.7vh, 27px)); color: #2b2a3a; }
.dc-card .st { display: flex; align-items: center; gap: 0.6vw; font-size: calc(var(--fs) * clamp(13px, 2.3vh, 23px)); color: #2b2a3a; }
.dc-card .st .v { margin-left: auto; white-space: nowrap; }
.dc-buttons { position: absolute; right: 1.6vw; bottom: 9vh; width: clamp(230px, 27vw, 360px); display: flex; flex-direction: column; gap: 0.9vh; }
.dc-btn { cursor: pointer; font-size: calc(var(--fs) * clamp(14px, 2.6vh, 26px)); min-height: 56px; border: 3px solid #a8b6d8; box-shadow: 4px 4px 0 rgba(6, 7, 12, 0.8); background: #1f2a4a; color: #f2efe6; display: flex; align-items: center; gap: 0.8vw; padding: 0 1vw; }
.dc-btn.main { font-size: calc(var(--fs) * clamp(17px, 3vh, 32px)); min-height: 62px; border-color: #cfe4ff; background: #2f86d8; color: #ffffff; }

.dc-sage { position: absolute; left: 1.6vw; bottom: 1.6vh; display: flex; align-items: flex-end; gap: 0.4vw; }

.dc-prize .ds { font-size: calc(var(--fs) * clamp(11px, 1.95vh, 19px)); color: #d8c9a4; }

/* ---- エンディング ---- */
.ending-screen { background: #0b1024; display: flex; align-items: center; justify-content: center; }
/* 絵の箱は 3:2。中の文字は 箱の高さ（cqh）で決める（たて長の画面でも 絵と ずれない） */
.ending-box { position: relative; width: min(100vw, calc(100vh * 3 / 2)); height: min(100vh, calc(100vw * 2 / 3)); container-type: size; }
.ending-box > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; image-rendering: pixelated; display: block; }
.end-logo { position: absolute; left: 2.2%; top: 3%; animation: fadein 0.5s steps(4) both; }
.end-logo .plate { position: relative; background: #12244d; border: 4px solid #0a1430; box-shadow: 6px 6px 0 rgba(6, 9, 22, 0.85), inset 0 0 0 3px #cfe4ff, inset 0 0 0 6px #2f5fa8, inset 0 0 0 8px #0a1430; padding: clamp(8px, 1.6cqh, 16px) clamp(12px, 1.4vw, 22px) clamp(6px, 1.2cqh, 12px); }
.end-logo .rib { position: absolute; left: 50%; top: calc(-1 * clamp(9px, 1.7cqh, 17px)); transform: translateX(-50%); background: #0a1430; border: 3px solid #cfe4ff; padding: 0 10px; font-size: clamp(11px, 1.5cqh, 14px); color: #cfe4ff; white-space: nowrap; letter-spacing: 0.14em; }
.end-logo .row { display: flex; align-items: center; gap: clamp(6px, 0.8vw, 12px); }
.end-logo .nm { font-size: clamp(22px, 4.2cqh, 46px); line-height: 1.1; color: #ffffff; white-space: nowrap; text-shadow: 0 4px 0 #2f5fa8, 3px 0 0 #0a1430, -3px 0 0 #0a1430, 0 -3px 0 #0a1430, 0 3px 0 #0a1430, 3px 3px 0 #0a1430, -3px 3px 0 #0a1430, 3px -3px 0 #0a1430, -3px -3px 0 #0a1430; }
.end-logo .stud { position: absolute; width: 7px; height: 7px; background: #cfe4ff; box-shadow: 0 0 0 2px #0a1430; display: block; }

  function magnitudeChoices(rng, item) {
    const r = Units.ref(item);
    const v = r.area.value;
    const units = ['cm²', 'm²', 'a', 'ha', 'km²'];
    const picks = units.filter(function (u) { return u !== r.area.unit; });
    const wrongUnits = rng.shuffle(picks).slice(0, 3);
    const options = [{ text: v + r.area.unit, correct: true }].concat(wrongUnits.map(function (u) { return { text: v + u }; }));
    return mkChoice(rng, options);
  }

      const all = Figure.fullEdgeLabels(fig);
      const plan = Hide.planWithTarget(fig, all, { rng: rng.fork('hide'), maxHidden: 2, targetHidden: 2, maxOps: 2, tries: 6 });
      const area = Figure.area(fig);
      const wrong = {};
      const b = Figure.bounds(fig);
      wrong[String(b.w * b.h)] = 'no-cut';
      return {
        prompt: kind === 't' ? 'どこで切る? 1本の線で 2つの長方形に分けられるよ。' : 'どこで切る? 2本の線で 3つの長方形に分けられるよ。',

        cut: { guide: 'half', hiddenCount: plan.hidden.length },
        answer: area, unit: 'cm²', wrong: wrong,
        explain: { sentence: '長方形になるまで 切る。それぞれ たて×よこ を出して、ぜんぶたす。', byMisconception: L_MISCONCEPTIONS, steps: [{ key: 'cut', kind: 'cut', label: '切って、ひとつずつ', guide: 'full' }] }

  Bank.register({
    id: 'f13-gate-why-minus', floor: 13, format: 'choice', gate: true,
    make: function (rng) {
      const L = randomL(rng, { minW: 6, maxW: 10, minH: 5, maxH: 8, corner: 'tr' });
      const fig = Shapes.lShape(L.W, L.H, L.cw, L.ch, 'tr', { grid: true });
      const all = Figure.fullEdgeLabels(fig);
      // 下の辺(W)と、欠けの下側の辺(cw)を見せ、上の辺(W-cw)を「?」にする
      const hiddenId = all.filter(function (l) { return l.axis === 'x' && l.facing === 'up' && l.b === L.W - L.cw; })[0].id;
      const shown = all.filter(function (l) { return l.id !== hiddenId; });
      const hidden = all.filter(function (l) { return l.id === hiddenId; });
      const c = mkChoice(rng, [
        { text: '向かい合う辺は 同じ長さだから', correct: true },
        { text: L.W + 'のほうが 大きいから' },
        { text: 'ひき算の問題だから' }
      ]);
      return {
        // 答えは 理由（辺の 長さでは ない）ので「?」は 出さない。どの辺かは ことばで 言う（本人の指定 2026-09-17）
        prompt: '上の 左がわの 辺は ' + L.W + '−' + L.cw + ' で 出せる。なぜ ' + L.W + '−' + L.cw + ' なの?',

        choices: c.choices, answer: c.answer,
        explain: {

        }

    }
  });

  Bank.register({
    // 答案の まちがい探し。えらぶ形だと まちがい直しで 消去法で 当たるので、正しい 面積を 数で 答える（本人の指摘 2026-09-15）
    id: 'f14-peer', floor: 14, format: 'number',
    make: function (rng, params) {
      const kind = params.kind || rng.pick(['one-part', 'double-cut', 'wrong-side', 'add-cut']);
      const L = randomL(rng, { minW: 6, maxW: 10, minH: 5, maxH: 8, corner: 'tr' });
      const fig = Shapes.lShape(L.W, L.H, L.cw, L.ch, 'tr', { grid: true });
      const area = Figure.area(fig);
      const leftW = L.W - L.cw, lowH = L.H - L.ch;
      let expr, value;
      if (kind === 'one-part') { expr = L.H + '×' + leftW + '＝' + L.H * leftW; value = L.H * leftW; }
      else if (kind === 'double-cut') { expr = L.W + '×' + L.H + '−' + L.cw + '×' + L.ch + '−' + L.cw + '×' + L.ch + '＝' + (L.W * L.H - 2 * L.cw * L.ch); value = L.W * L.H - 2 * L.cw * L.ch; }
      else if (kind === 'add-cut') { expr = L.W + '×' + L.H + '＋' + L.cw + '×' + L.ch + '＝' + (L.W * L.H + L.cw * L.ch); value = L.W * L.H + L.cw * L.ch; }
      else { expr = L.H + '×' + L.W + '＋' + lowH + '×' + L.cw + '＝' + (L.H * L.W + lowH * L.cw); value = L.H * L.W + lowH * L.cw; }
      const wrong = {};
      wrong[String(value)] = kind;
      return {
        prompt: 'この 答案は まちがい。正しい 面積は 何cm²?',
        figure: QFig.fromFigure(fig, Figure.fullEdgeLabels(fig), [], { interaction: null }),
        peerAnswer: expr + '　答え ' + value + 'cm²',
        answer: area, unit: 'cm²', wrong: wrong,
        explain: {
          sentence: kind === 'one-part'
            ? L.H + '×' + leftW + ' は 左の長方形だけ。右の ' + lowH + '×' + L.cw + ' も たすよ。'
            : kind === 'double-cut'
              ? '欠けた ' + L.cw + '×' + L.ch + ' をひくのは 1回。' + L.W + '×' + L.H + ' から 1回だけ ひくよ。'
              : kind === 'add-cut'
                ? '切り取った ' + L.cw + '×' + L.ch + ' は、大きい長方形から ひくよ。たすと 広くなりすぎる。'
              : '上の長方形の よこは ' + L.W + ' ではなく ' + leftW + '（' + L.W + '−' + L.cw + '）。向かい合う辺は 同じ長さだよ。',
          steps: [
            { key: 'left', label: '左の長方形', parts: ['たて', B('lh', L.H, 'cm'), '×', 'よこ', B('lw', leftW, 'cm'), '＝', B('la', L.H * leftW, 'cm²', ['mul', L.H, leftW])] },
            { key: 'right', label: '右の長方形', parts: ['たて', B('rh', lowH, 'cm'), '×', 'よこ', B('rw', L.cw, 'cm'), '＝', B('ra', lowH * L.cw, 'cm²', ['mul', lowH, L.cw])] },
            { key: 'sum', label: 'ぜんぶ', parts: [B('l2', L.H * leftW, 'cm²'), '＋', B('r2', lowH * L.cw, 'cm²'), '＝', B('area', area, 'cm²', ['add', [L.H * leftW, lowH * L.cw]])] }
          ]
        }
      };
    }
  });

    id: 'f14-mixed-unit', floor: 14, format: 'cut',
    make: function (rng) {
      // 座標は 50cm を1マスとして持つ。ラベルは m と cm がまざる。
      // 50cmを1マス。面積が大きくなりすぎないよう 辺を短く（外は 最大4マス=2m）
      const W = rng.pick([3, 4]), H = rng.pick([3, 4]);
      const cw = rng.pick([1, 2]), ch = rng.pick([1, 2]);
      const fig = Shapes.lShape(W, H, cw, ch, 'tr', { grid: false });
      const all = Figure.fullEdgeLabels(fig);
      const toText = function (units50) {
        const cm = units50 * 50;
        if (cm % 100 === 0) return (cm / 100) + 'm';
        return cm + 'cm';
      };
      const shown = QFig.labelValueOverride(all, function (l) { return toText(l.b - l.a); });
      const area = (W * 50) * (H * 50) - (cw * 50) * (ch * 50);
      const wrong = {};
      wrong[String(area / 10000)] = 'unit-mix';
      wrong[String((W * 50) * (H * 50))] = 'no-cut';
      return {
        prompt: '単位がまざったL字の形。面積は何cm²?（1m＝100cm）',
        figure: QFig.fromFigure(fig, shown, [], { interaction: 'cut', unitScale: 50 }),
        cut: { guide: 'free', scale: 50 },
        answer: area, unit: 'cm²', wrong: wrong,
        explain: {
          sentence: 'まず単位を cm にそろえる（1m＝100cm）。それから 分けて たて×よこ、たす。',
          byMisconception: { 'unit-mix': '単位を cm にそろえてから 計算するよ。1m＝100cm。' },
          steps: [{ key: 'cut', kind: 'cut', label: '単位をそろえて、切る', guide: 'full', scale: 50 }]

        y += s; count += 1;
      }
      let topX = 0;
      while (count < n && topX < big) {
        const s = Math.min(big - topX, rng.int(1, 3));
        spec.push({ x: topX, y: big, s: s });
        topX += s; count += 1;
      }
    }
    const fig = Shapes.squaresPuzzle(spec, { unit: unitOf(o), grid: !o.noGrid });
    const squares = fig.pieces.map(function (p) { return p.index; });
    const edges = Figure.fullEdgeLabels(fig);
    const target = Math.max(1, edges.length - (o.showLabels || 1));
    const plan = Hide.planWithTarget(fig, edges, { rng: rng.fork('hide'), targetHidden: target, maxHidden: target, maxOps: o.ops == null ? 4 : o.ops, squares: squares, tries: 12 });
    const q = figureQuestion(fig, plan, { sentence: '正方形は 4つの辺がみんな同じ。1本わかれば となりの正方形の辺も つぎつぎと わかるよ。', prompt: 'ぜんぶ正方形。面積は何' + fig.unit + '²?' });
    q.figure.pieceEdges = true;   // どこが 1つの 正方形か 見えないと 解けない
    return q;
  }

  // ---- 逆問題 ----
  function makeReverse(rng, o) {
    const kind = o.kind || 'rect-area-perim';
    const unit = unitOf(o);
    if (kind === 'rect-area-perim') {
      const h = rng.int(2, 9), w = rng.int(h + 1, 15);
      const area = h * w, perim = 2 * (h + w);
      return {
        prompt: '面積' + area + unit + '²、まわり' + perim + unit + ' の 長方形。たてと よこは?（たて<よこ）',
        figure: QFig.rectSpec(w, h, { grid: false, unit: unit, labels: 'none', areaText: area + unit + '²', marks: [{ kind: 'perimeter', text: 'まわり ' + perim + unit }] }),
        fields: [{ key: 'h', label: 'たて', unit: unit, answer: h }, { key: 'w', label: 'よこ', unit: unit, answer: w }],
        explain: { sentence: 'たて＋よこ＝' + (perim / 2) + '。たして' + (perim / 2) + '、かけて' + area + 'になる 2つの数をさがす。', steps: [{ key: 'half', label: 'たて＋よこ', parts: [B('half', perim / 2, unit)] }, { key: 'pair', label: '2つの数', parts: ['たて', B('h', h, unit), 'よこ', B('w', w, unit)] }] }
      };
    }
    // がくぶちの 面積から はばを 出す（数は 3つだけ。ひらめきが いる。本人の案 2026-09-16）
    if (kind === 'frame-area-width') {
      let W = 0, H = 0, b = 0;
      for (let t = 0; t < 40; t += 1) {
        W = rng.int(10, 20); H = rng.int(8, 16); b = rng.int(1, 3);
        if (W - 2 * b >= 3 && H - 2 * b >= 3) break;
      }
      const fig = Shapes.frame(W, H, { left: b, right: b, top: b, bottom: b }, { unit: unit, grid: false });
      const area = Figure.area(fig);
      const labels = [Figure.dimLabel('x', 0, W, W, -1), Figure.dimLabel('y', 0, H, H, -1)];
      return {
        prompt: 'たて' + H + unit + '・よこ' + W + unit + ' の がくぶち。色の 部分が ' + area + unit + '² のとき、はばは 何' + unit + '?',
        figure: QFig.fromFigure(fig, labels, [], { interaction: null, areaText: area + unit + '²' }),
        answer: b, unit: unit,
        explain: {
          sentence: '内の 長方形の 面積は 外ぜんたい から 色の 部分を ひいた 分。はばを 1・2・3 と ためして、内の たて・よこが 合う ところを さがすよ。はばは 両がわに あるから、内の よこは ' + W + ' から はば2つ分を ひく。',
          steps: [
            { key: 'inner', label: '内の面積', parts: [B('big', W * H, unit + '²'), '−', B('col', area, unit + '²'), '＝', B('in', (W - 2 * b) * (H - 2 * b), unit + '²')] },
            { key: 'w', label: 'はば', parts: ['内は たて ' + (H - 2 * b) + '・よこ ' + (W - 2 * b) + '。はばは', B('b', b, unit)] }
          ]
        }
      };
    }
    if (kind === 'L-area-side') {
      const big = !!o.big;
      const W = big ? rng.int(18, 34) : rng.int(8, 14), H = big ? rng.int(14, 26) : rng.int(6, 10);
      const cw = rng.int(2, W - 3), ch = rng.int(2, H - 2);
      const fig = Shapes.lShape(W, H, cw, ch, 'tr', { grid: false, unit: unit });
      const area = Figure.area(fig);
      const all = Figure.fullEdgeLabels(fig);
      // 欠けの たて(ch) を「?」にして、面積から出させる
      const hiddenId = all.filter(function (l) { return l.axis === 'y' && l.b - l.a === ch && l.a === H - ch && l.at === W - cw; })[0];
      const shownIds = all.filter(function (l) { return l.axis === 'x' && (l.b - l.a === W || l.b - l.a === cw); }).concat(all.filter(function (l) { return l.axis === 'y' && l.b - l.a === H; }));
      return {
        // 辺の 長さを 聞く問題なので「?」は 出す（黄色い なぞりは 出さない。本人の指定 2026-09-17）
        prompt: 'この形の面積は ' + area + unit + '²。欠けた ところの たては 何' + unit + '?',
        figure: QFig.fromFigure(fig, shownIds, hiddenId ? [hiddenId] : [], { interaction: null, areaText: area + unit + '²', askMark: true }),
        answer: ch, unit: unit,
        explain: { sentence: '大きい長方形（' + W + '×' + H + '）から ' + area + ' をひくと、欠けの面積が出る。それを 欠けのよこ ' + cw + ' でわると、欠けの たてだよ。', steps: [{ key: 'gap', label: '欠けの面積', parts: [B('big', W * H, unit + '²'), '−', B('area', area, unit + '²'), '＝', B('cut', W * H - area, unit + '²')] }, { key: 'side', label: '辺', parts: [B('cut2', W * H - area, unit + '²'), '÷', B('cw', cw, unit), '＝', B('ch', ch, unit)] }] }
      };
    }
    // rect-area-side（大きい数）
    const h = rng.int(12, 45), w = rng.int(12, 60);
    const area = h * w;
    return {
      prompt: '面積' + area + unit + '²、たて' + h + unit + '。よこは何' + unit + '?',
      figure: QFig.rectSpec(w, h, { grid: false, unit: unit, labels: 'h', areaText: area + unit + '²' }),
      answer: w, unit: unit,
      explain: { sentence: area + '÷' + h + ' で よこが出るよ。', steps: Bank.stepsReverse(area, h, 'たて', w, 'よこ', unit) }
    };
  }

  // ---- 面積が等しくなる線を引く ----
  function makeEqualCut(rng, o) {
    const unit = unitOf(o);
    const kind = o.kind || rng.pick(['rect', 'stairs']);
    let fig;
    if (kind === 'rect') {
      const W = rng.int(3, 6) * 2, H = rng.int(3, 7);
      fig = Shapes.rect(W, H, { unit: unit, grid: true });
    } else if (kind === 'L') {
      // 組み合わせた形を 半分に（本人の案 2026-09-16）。1本の線で 半分ずつに できる形だけ 出す（作ってから たしかめる）
      const halves = function (f, total) {
        const bb = Figure.bounds(f);
        const ok = function (line) {
          const a = Figure.analyzeLines(f, [line]);
          return a.mode === 'cut' && a.parts.length === 2 && a.parts[0].w * a.parts[0].h === total / 2;
        };
        for (let x = bb.x1 + 1; x < bb.x2; x += 1) if (ok({ x1: x, y1: bb.y1, x2: x, y2: bb.y2 })) return true;
        for (let y = bb.y1 + 1; y < bb.y2; y += 1) if (ok({ x1: bb.x1, y1: y, x2: bb.x2, y2: y })) return true;
        return false;
      };
      for (let t = 0; t < 60 && !fig; t += 1) {
        const W = rng.int(5, 9), H = rng.int(4, 8);
        const cw = rng.int(1, W - 2), ch = rng.int(1, H - 2);
        const f = Shapes.lShape(W, H, cw, ch, rng.pick(['tr', 'tl', 'br', 'bl']), { unit: unit, grid: true });
        const total = Figure.area(f);
        if (total % 2 === 0 && halves(f, total)) fig = f;
      }
      if (!fig) fig = Shapes.lShape(6, 5, 2, 2, 'tr', { unit: unit, grid: true });
    } else {
      // 下 W1×h1、上 W2×h2 で 面積が同じ → 横に切ると等しい
      const pairs = [[6, 2, 4, 3], [8, 3, 6, 4], [9, 2, 6, 3], [10, 3, 6, 5], [12, 2, 8, 3]];
      const p = rng.pick(pairs);
      fig = Shapes.stairs([{ w: p[0], h: p[1] }, { w: p[2], h: p[3] }], { unit: unit, grid: true });
    }
    const labels = dedupeCandidates(Figure.fullEdgeLabels(fig));
    const area = Figure.area(fig);
    return {
      format: 'line',
      prompt: '面積が 半分ずつ（' + (area / 2) + unit + '²ずつ）になるように、1本の線で 2つに分けよう。',
      figure: QFig.fromFigure(fig, labels, [], { interaction: 'cut' }),
      answer: area / 2, unit: unit + '²',
      lineCheck: function (lines) {
        const a = Figure.analyzeLines(fig, lines);
        if (a.mode !== 'cut' || a.parts.length !== 2) return { correct: false, message: a.mode === 'partial' ? 'まだ2つに分かれていないよ。' : '1本の線で 2つに分けよう。' };
        const areas = a.parts.map(function (p) { return p.w * p.h; });
        return { correct: areas[0] === areas[1], areas: areas, message: areas[0] === areas[1] ? '' : '左右（上下）の面積が ' + areas.join('と') + ' でちがうよ。' };
      },
      explain: { sentence: '全体は ' + area + unit + '²。半分の ' + (area / 2) + ' になる長方形が できるところで切るよ。' }
    };
  }

  // ---- 単位が混ざる ----
  function makeUnitMixed(rng, o) {
    // 座標は 50cm を1マス。ラベルは m と cm がまざる（少なくとも1本は m）。答えは cm²
    let base = null;
    for (let t = 0; t < 10; t += 1) {
      base = makeStairs(rng.fork('mix' + t), Object.assign({}, o, { unit: 'cm', noGrid: true, steps: o.steps || 3 }));
      if (base.figure.labels.some(function (l) { return (l.b - l.a) % 2 === 0; }) && base.figure.labels.some(function (l) { return (l.b - l.a) % 2 === 1; })) break;
    }
    const fig = base.figure.fig;
    const toText = function (u) { const cm = u * 50; return cm % 100 === 0 ? (cm / 100) + 'm' : (cm >= 100 ? Math.floor(cm / 100) + 'm' + (cm % 100) + 'cm' : cm + 'cm'); };
    base.figure.labels = QFig.labelValueOverride(base.figure.labels, function (l) { return toText(l.b - l.a); });
    base.figure.unitScale = 50;
    base.answer = Figure.area(fig) * 2500;
    base.prompt = '単位が m と cm で まざっている（1m＝100cm）。面積は何cm²?';
    base.explain = { sentence: 'まず ぜんぶ cm にそろえる。1m＝100cm。それから 分けて たて×よこ。', steps: [{ key: 'total', label: '面積', parts: ['ぜんぶで', B('area', base.answer, 'cm²')] }] };
    base.cut = { scale: 50 };
    return base;
  }

  // ---- この答案は正しい? ----
  function makePeerCheck(rng, o) {
    const kind = o.kind || rng.pick(['road', 'frame']);
    const unit = unitOf(o);
    if (kind === 'road') {
      const W = rng.int(12, 30), H = rng.int(10, 24), rw = rng.int(1, 3), rh = rng.int(1, 3);
      const fig = Shapes.road(W, H, [{ axis: 'v', at: rng.int(2, W - rw - 2), width: rw }, { axis: 'h', at: rng.int(2, H - rh - 2), width: rh }], { unit: unit, grid: false });
      const labels = [Figure.dimLabel('x', 0, W, W, -1), Figure.dimLabel('y', 0, H, H, -1)];
      const right = (W - rw) * (H - rh);
      const doubleCut = W * H - rw * H - rh * W;
      const isRight = rng.chance(0.4);
      const expr = isRight ? '(' + W + '−' + rw + ')×(' + H + '−' + rh + ')＝' + right : W + '×' + H + '−' + rw + '×' + H + '−' + rh + '×' + W + '＝' + doubleCut;
      // えらぶ形だと 消去法で 当たるので、自分で 計算した 面積を 数で 答える（本人の指摘 2026-09-15）
      const wrongMap = {};
      wrongMap[String(doubleCut)] = 'double-cut';
      wrongMap[String(W * H)] = 'no-cut';
      return {
        format: 'number',
        prompt: '道を のぞいた 面積は 何' + unit + '²? 答案が 正しいか、自分で 計算しよう。',
        figure: QFig.fromFigure(fig, labels, [], { interaction: null, caption: '道のはば ' + rw + unit + '・' + rh + unit }),
        peerAnswer: expr,
        answer: right, unit: unit + '²', wrong: wrongMap,
        explain: { sentence: '道が交わるところは 2本の道に共通。たて道とよこ道を べつべつにひくと、交わる ' + rw + '×' + rh + ' を2回ひいてしまう。道をよせて (' + W + '−' + rw + ')×(' + H + '−' + rh + ')＝' + right + ' が正しい。' }
      };
    }
    const W = rng.int(12, 30), H = rng.int(10, 24), b = rng.int(1, 4);
    const fig = Shapes.frame(W, H, { left: b, right: b, top: b, bottom: b }, { unit: unit, grid: false });
    const labels = [Figure.dimLabel('x', 0, W, W, -1), Figure.dimLabel('y', 0, H, H, -1), Figure.dimLabel('x', 0, b, b, Math.floor(H / 2))];
    const right = W * H - (W - 2 * b) * (H - 2 * b);
    const wrongInner = W * H - (W - b) * (H - b);
    const isRight = rng.chance(0.4);
    const expr = isRight ? W + '×' + H + '−' + (W - 2 * b) + '×' + (H - 2 * b) + '＝' + right : W + '×' + H + '−' + (W - b) + '×' + (H - b) + '＝' + wrongInner;
    const wrongMap = {};
    wrongMap[String(wrongInner)] = 'wrong-side';
    return {
      format: 'number',
      prompt: 'がくぶちの 面積は 何' + unit + '²? 答案が 正しいか、自分で 計算しよう。',
      figure: QFig.fromFigure(fig, labels, [], { interaction: null, caption: 'がくのはば ' + b + unit }),
      peerAnswer: expr,
      answer: right, unit: unit + '²', wrong: wrongMap,
      explain: { sentence: 'はばは 左右・上下の両がわにある。内のよこは ' + W + '−' + b + '−' + b + '＝' + (W - 2 * b) + '、内のたては ' + (H - 2 * b) + '。' }
    };
  }

  // ---- がくぶち＋道 ----
  function makeFrameRoad(rng, o) {
    const W = rng.int(12, 20), H = rng.int(10, 16), b = rng.int(1, 3), rw = rng.int(1, 3);
    const roadAt = rng.int(b + 1, W - b - rw - 1);
    const fig = Figure.create([
      { x: 0, y: 0, w: W, h: H },
      { x: b, y: b, w: W - 2 * b, h: H - 2 * b, role: 'hole', name: 'pond' },
      { x: roadAt, y: 0, w: rw, h: H, role: 'hole', name: 'road' }
    ], { unit: unitOf(o), grid: !o.noGrid });
    const edges = Figure.fullEdgeLabels(fig);
    const dims = [Figure.dimLabel('x', 0, W, W, -1), Figure.dimLabel('y', 0, H, H, -1), Figure.dimLabel('x', 0, b, b, Math.floor(H / 2)), Figure.dimLabel('x', roadAt, roadAt + rw, rw, H + 1), Figure.dimLabel('y', 0, b, b, Math.floor(W / 2))];
    const plan = planFor(rng, fig, edges.concat(dims), o);
    return figureQuestion(fig, plan, { prompt: 'がくぶちの 土地に 道が 通る。色の 部分の 面積は?', sentence: 'がくぶちの面積（外−内）から、道が がくぶちと重なる部分をひく。道は 上と下の2か所で がくぶちを通るよ。' });
  }

  // ---- 塔の切り口の図と手帳 ----
  const TOWER_SEED = 'tower-handbook-v1';

  function towerCandidates(fig) {
    const H = Shapes.TOWER_FLOOR_HEIGHT;
    const labels = [];
    Shapes.TOWER_WIDTHS.forEach(function (w, i) {
      labels.push(Figure.dimLabel('x', 0, w, w, i * H + 1, { facing: 'floor' + (i + 1) }));
    });
    const edges = Figure.fullEdgeLabels(fig);
    const hole = Shapes.TOWER_HOLE;
    edges.forEach(function (l) {
      if (l.axis !== 'x' || l.at <= 0 || l.at >= 14 * H || (l.b - l.a) >= 24) return;
      const isWindowEdge = (l.at === hole.y || l.at === hole.y + hole.h) && l.a >= hole.x && l.b <= hole.x + hole.w;
      if (isWindowEdge) return;
      labels.push(l);
    });
    labels.push(Figure.dimLabel('x', hole.x, hole.x + hole.w, hole.w, hole.y + 1));
    labels.push(Figure.dimLabel('x', 0, hole.x, hole.x, hole.y + 2));
    labels.push(Figure.dimLabel('y', hole.y, hole.y + hole.h, hole.h, hole.x - 1));
    return labels;
  }

  function towerHeightLabels() {
    const H = Shapes.TOWER_FLOOR_HEIGHT;
    return Shapes.TOWER_WIDTHS.map(function (w, i) { return Figure.dimLabel('y', i * H, (i + 1) * H, H, -1); });
  }

  let towerPlanCache = null;
  function towerPlan() {
    if (towerPlanCache) return towerPlanCache;
    const fig = Shapes.tower();
    const heights = towerHeightLabels();
    const cands = towerCandidates(fig);
    const rng = Util.createRng(TOWER_SEED);
    const plan = Hide.planWithTarget(fig, cands.concat(heights), {
      rng: rng, targetHidden: 6, maxHidden: 6, maxOps: 3, mustShow: heights.map(function (l) { return l.id; }), tries: 12
    });
    towerPlanCache = { fig: fig, plan: plan, heights: heights };
    return towerPlanCache;
  }

  function labelText(l) {
    const H = Shapes.TOWER_FLOOR_HEIGHT;
    const len = l.b - l.a;
    if (l.kind === 'dim' && l.axis === 'x' && l.a === 0 && l.facing && String(l.facing).indexOf('floor') === 0) return 'よこ ' + len + 'm';
    if (l.kind === 'dim' && l.axis === 'x' && l.a === Shapes.TOWER_HOLE.x) return 'まどのよこ ' + len + 'm';
    if (l.kind === 'dim' && l.axis === 'x' && l.b === Shapes.TOWER_HOLE.x) return 'かべから まどまで ' + len + 'm';
    if (l.kind === 'dim' && l.axis === 'y') return 'まどのたて ' + len + 'm';
    if (l.kind === 'edge' && l.axis === 'x') {
      if (l.facing === 'up') return '上の階は ここより ' + len + 'm せまい';
      if (l.facing === 'down') return '下の階より ' + len + 'm 右に出ている';
    }
    return len + 'm';
  }

  function floorOfLabel(l) {
    const H = Shapes.TOWER_FLOOR_HEIGHT;
    const hole = Shapes.TOWER_HOLE;
    if (l.kind === 'dim' && l.axis === 'x' && String(l.facing || '').indexOf('floor') === 0) return Number(String(l.facing).slice(5));
    if (l.kind === 'edge' && l.axis === 'x') {
      const k = Math.round(l.at / H);
      if (l.facing === 'up') return Math.max(1, k);
      return Math.min(14, k + 1);
    }
    // まどの寸法線は、まどのある階（4階）
    if (l.kind === 'dim' && (l.axis === 'y' || l.a === hole.x || l.b === hole.x)) return Math.floor(hole.y / H) + 1;
    if (l.at != null) return Math.min(14, Math.max(1, Math.floor(l.at / H) + 1));
    return 1;
  }

  let handbookCache = null;
  function handbookLines() {
    // 各階クリア時に手帳に増える行。hidden は屋上で「□」として見える。どの階も 1行以上増える
    if (handbookCache) return handbookCache;
    const t = towerPlan();
    const perFloor = {};
    for (let i = 1; i <= 14; i += 1) perFloor[i] = [];
    let shown = t.plan.shown.slice();
    let hidden = t.plan.hidden.slice();
    const isHeight = function (l) { return l.axis === 'y' && t.heights.some(function (h) { return h.id === l.id; }); };
    // その階の「よこ」が 図にも 手帳にも 出てこないと、その階だけ 面積が 出せない（本人の指摘 2026-09-16「理不尽はだめ」）。
    // 「上の階より 2m せまい」のような 差の行だけでは よこは 出せないので、よこの 寸法線が あるかで 数える
    const hasWidth = function (no) {
      return shown.some(function (l) { return !isHeight(l) && floorOfLabel(l) === no && l.kind === 'dim' && l.axis === 'x' && l.a === 0; });
    };
    for (let no = 1; no <= 14; no += 1) {
      if (hasWidth(no)) continue;
      // その階のはばの寸法線を 空らんから見せる側へ移す
      const idx = hidden.findIndex(function (l) { return floorOfLabel(l) === no && l.kind === 'dim' && l.a === 0; });
      if (idx >= 0) { shown.push(hidden[idx]); hidden.splice(idx, 1); }
    }
    shown.forEach(function (l) {
      if (isHeight(l)) return;
      perFloor[floorOfLabel(l)].push({ labelId: l.id, text: labelText(l), value: l.b - l.a });
    });
    perFloor[1].unshift({ labelId: 'floor-height', text: 'どの階も 高さ3m', value: 3 });
    const blanks = hidden.map(function (l) { return { labelId: l.id, floor: floorOfLabel(l), text: labelText(l).replace(/\d+m/, '□m'), value: l.b - l.a }; });
    handbookCache = { perFloor: perFloor, blanks: blanks, shown: shown, hidden: hidden, solution: Deduce.solve(t.fig, shown.concat(t.heights)) };
    return handbookCache;
  }

  function makeTower(rng, o) {
    const t = towerPlan();
    const hb = handbookLines();
    const fig = t.fig;
    const area = Figure.area(fig);
    const hole = Shapes.TOWER_HOLE;
    const shown = hb.shown.filter(function (l) { return !t.heights.some(function (h) { return h.id === l.id; }); });
    const widthsSum = Util.sum(Shapes.TOWER_WIDTHS);
    const blankSteps = hb.blanks.map(function (bl) {

      if (q.format !== 'line' && isBlankGiven(given)) return { result: { empty: true, correct: false }, question: q, done: false };
      // 形の ちがう答え（順番・ペアに 配列でない、数に 配列 など）や、読めない数（3.5 など）も 進めずに 返す

        res.record.stumbled = true;
        res.stumbled = true;

    engine.outcome = function () { return p.lastOutcome; };

    engine.retryHissan = function (value) { return p.retry ? afterRetryStep(Retry.submitHissan(p.retry, value)) : NO_RETRY; };
    engine.retryHissanConfirm = function () { return p.retry ? afterRetryStep(Retry.confirmHissan(p.retry)) : NO_RETRY; };
    engine.retryChoice = function (choiceId) { return p.retry ? afterRetryStep(Retry.submitChoice(p.retry, choiceId)) : NO_RETRY; };
    engine.retryOrder = function (order) { return p.retry ? afterRetryStep(Retry.submitOrder(p.retry, order)) : NO_RETRY; };
    engine.retryPairs = function (pairs) { return p.retry ? afterRetryStep(Retry.submitPairs(p.retry, pairs)) : NO_RETRY; };
    engine.retryReanswer = function (given) { return p.retry ? afterRetryStep(Retry.submitReanswer(p.retry, given)) : NO_RETRY; };
    engine.retryGuide = function () { return p.retry ? Retry.guideFor(p.retry) : null; };

    function applyRematchOutcome() {

      result.outcome = 'rematch';
      result.guardId = id;
      result.win = win;
      result.applied = true;
      p.lastOutcome = { outcome: 'rematch', guardId: id, correct: result.correct, total: result.total, win: win, floorNo: p.session ? p.session.floorNo : null };

    }

    function applyOutcomeInner() {
      // やり直しが終わったあと、階の結果を進み具合に反映する
      if (!p.lastResult || p.lastResult.applied) return p.lastResult;
      if (p.mode === 'rematch') return applyRematchOutcome();
      const result = p.lastResult;
      const summary = p.retry ? Retry.summary(p.retry) : { reissue: [], stopStats: {} };
      Object.keys(summary.stopStats).forEach(function (k) { p.stopStats[k] = (p.stopStats[k] || 0) + summary.stopStats[k]; });
      const floorNo = p.session.floorNo;
      const stats = p.floorStats[floorNo] || { attempts: 1, gateFails: 0, cleared: false, hints: 0 };
      // 間違えた問題は次の階に数字を変えて混ぜる（関所と、3回連続で不正解だったものを優先）
      const wrongTemplates = result.wrong.map(function (a) { return { templateId: a.templateId, params: a.params, gate: a.gate }; });

    function buildRematchSession(id) {

      p.rematchId = guardId;

      const q = engine.undergroundQuestion();

      p.stats.answered += 1;
      touch();
      if (!res.correct) {
        res.askWhere = 'どこが ちがう? もう一度。';

        if (s.tries >= 3) res.help = ugHelpText(q);

      }

      if (s.stage === 'main' && Underground.get(s.no).extra) {

        s.lines = [];
        save();

      }

    engine.handbook = function () {

      return { lines: p.handbook.slice(), blanks: p.roofCleared ? all.blanks : [] };
    };

    engine.story = function (kind, floorNo) {
      const Story = root_.MT && root_.MT.Story;
      if (!Story) return ['', ''];
      if (kind === 'enter') return Story.enter(floorNo || p.currentFloor);
      if (kind === 'clear') return Story.clear(floorNo || p.currentFloor);
      if (kind === 'redo') return Story.FLOOR_REDO;
      if (kind === 'roof') return Story.ROOF;
