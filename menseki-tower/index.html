      // 図が へこんでいる がわ（かいだんの 角が ある がわ）に 出すと、点線が 角に まっすぐ とどいて わかりやすい
      const sideFor = function (l) {
        const full = l.axis === 'x' ? (l.a <= b.x1 && l.b >= b.x2) : (l.a <= b.y1 && l.b >= b.y2);
        if (full) return origSide(l);
        let lo = 0, hi = 0;
        [l.a, l.b - 1].forEach(function (e) {
          if (l.axis === 'y') { if (maps.rowMin[e] != null) { lo = Math.max(lo, maps.rowMin[e] - b.x1); hi = Math.max(hi, b.x2 - maps.rowMax[e]); } }
          else if (maps.colMin[e] != null) { lo = Math.max(lo, maps.colMin[e] - b.y1); hi = Math.max(hi, b.y2 - maps.colMax[e]); }
        });
        if (hi > lo) return l.axis === 'y' ? 'right' : 'top';
        if (lo > hi) return l.axis === 'y' ? 'left' : 'bottom';
        return origSide(l);
      };
      const sides = { bottom: [], top: [], left: [], right: [] };
      const sideOf = new Map();
      all.forEach(function (o, i) {
        const l = o.l;
        if (l.kind !== 'dim' || l.at == null) return;
        // 塔: 各階の よこは 帯の 中に 書く（外に 積むと 図が つぶれる）。まどの 寸法は ふつうに 外へ
        if (spec.dimsInside && l.axis === 'x' && String(l.facing || '').indexOf('floor') === 0) return;
        const side = sideFor(l);
        sideOf.set(o, side);
        sides[side].push({ o: o, len: l.b - l.a, i: i });
      });
      const newAt = new Map();
      Object.keys(sides).forEach(function (side) {
        const vertical = side === 'left' || side === 'right';
        const first = vertical ? margin * 2.4 : margin * 1.5;
        const gap = vertical ? margin * 2.0 : margin * 1.05;
        const lanes = [];   // lanes[k] = その列に 入っている はんい
        sides[side].sort(function (p, q) { return (p.len - q.len) || (p.i - q.i); }).forEach(function (it) {
          const l = it.o.l;
          const pad = vertical ? margin * 0.6 : margin * 1.2;   // 数の はばの ぶん あける
          let k = 0;
          while (lanes[k] && lanes[k].some(function (r) { return l.a < r.b + pad && l.b > r.a - pad; })) k += 1;
          (lanes[k] = lanes[k] || []).push({ a: l.a, b: l.b });
          const d = first + k * gap;
          newAt.set(it.o, side === 'bottom' ? b.y1 - d : side === 'top' ? b.y2 + d : side === 'left' ? b.x1 - d : b.x2 + d);
        });
      });
      const out = { labels: [], hidden: [], maps: maps };
      all.forEach(function (o) {
        const l = newAt.has(o) ? Object.assign({}, o.l, { at: newAt.get(o), at0: o.l.at, side: sideOf.get(o) }) : o.l;
        (o.hid ? out.hidden : out.labels).push(l);
      });
      return out;
    }

    // 寸法線の 両はしから 図の はし（かど）まで 細い 点線（どこから どこまでの 長さか わかるように）
    // 線と 同じ色で 引き、図の かどに 点を 打つ（線が まじわっても、どの かどまでの 長さか 色で たどれる）
    function drawExt(pl, l, g, color) {
      const m = pl.ext && pl.ext.maps;
      if (!m || !l.side) return;
      const col = color || '#c9a37a';
      [l.a, l.b].forEach(function (end, i) {
        const idx = i === 0 ? l.a : l.b - 1;
        let fx, fy, tx, ty;
        if (l.axis === 'y') {
          const ex = l.side === 'right' ? m.rowMax[idx] : m.rowMin[idx];
          if (ex == null) return;
          fx = pl.X(ex); fy = pl.Y(end); tx = pl.X(l.at); ty = fy;
        } else {
          const ey = l.side === 'top' ? m.colMax[idx] : m.colMin[idx];
          if (ey == null) return;
          fx = pl.X(end); fy = pl.Y(ey); tx = fx; ty = pl.Y(l.at);
        }
        svg('line', { x1: fx, y1: fy, x2: tx, y2: ty, stroke: col, 'stroke-width': 2, 'stroke-dasharray': '5 4', opacity: 0.75 }, g);
        svg('circle', { cx: fx, cy: fy, r: Math.max(4, Math.min(7, geo.cell * 0.22)), fill: col, stroke: '#fbf9f2', 'stroke-width': 1.5 }, g);
      });
    }

    function extentOf(spec, margin) {
      const b = Figure.bounds(spec.fig);
      const moved = outsideDims(spec, b, margin);
      let x1 = b.x1 - margin, x2 = b.x2 + margin, y1 = b.y1 - margin, y2 = b.y2 + margin;
      moved.labels.concat(moved.hidden).forEach(function (l) {
        if (l.kind !== 'dim' || l.at == null) return;
        if (l.axis === 'x') { y1 = Math.min(y1, l.at - margin * 0.9); y2 = Math.max(y2, l.at + margin * 0.9); }
        else { x1 = Math.min(x1, l.at - margin * 1.2); x2 = Math.max(x2, l.at + margin * 1.2); }
      });
      if (spec.caption || (spec.marks || []).some(function (m) { return m.kind === 'perimeter'; })) y1 -= margin * 0.9;
      return { x1: x1, x2: x2, y1: y1, y2: y2, w: x2 - x1, h: y2 - y1, b: b, labels: moved.labels, hidden: moved.hidden, maps: moved.maps };
    }

    // 数や「?」の 置き場所が かさならないように（あとから 置くものを 辺から はなれる ほうへ ずらす）
    let occupied = [];
    function boxOf(pt, w, hh) {
      const x = pt.anchor === 'middle' ? pt.x - w / 2 : pt.anchor === 'start' ? pt.x : pt.x - w;
      return { x1: x, y1: pt.y - hh / 2, x2: x + w, y2: pt.y + hh / 2 };
    }
    function hits(bx) { return occupied.some(function (o) { return bx.x1 < o.x2 && bx.x2 > o.x1 && bx.y1 < o.y2 && bx.y2 > o.y1; }); }
    function reserve(pt, w, hh) { occupied.push(boxOf(pt, w, hh)); return pt; }
    // 板の 中に おさめる（ふちで 切れないように）
    function clampIn(p, w, hh) {
      const bx = boxOf(p, w, hh);
      let dx = 0, dy = 0;
      if (bx.x1 < 3) dx = 3 - bx.x1; else if (bx.x2 > geo.bw - 3) dx = geo.bw - 3 - bx.x2;
      if (bx.y1 < 3) dy = 3 - bx.y1; else if (bx.y2 > geo.bh - 3) dy = geo.bh - 3 - bx.y2;
      return { x: p.x + dx, y: p.y + dy, anchor: p.anchor };
    }
    // 辺の 数: かさなったら 辺に そって ずらす → だめなら 少しだけ 外へ（遠くへは とばさない）
    function overlapArea(bx) {
      let s = 0;
      occupied.forEach(function (o) {
        const w = Math.min(bx.x2, o.x2) - Math.max(bx.x1, o.x1), hh = Math.min(bx.y2, o.y2) - Math.max(bx.y1, o.y1);
        if (w > 0 && hh > 0) s += w * hh;
      });
      return s;
    }
    function placeFree(pt, w, hh, l) {
      const outDx = l.axis === 'x' ? 0 : (l.facing === 'right' ? 1 : -1) * (w * 0.35 + 4);
      const outDy = l.axis === 'x' ? (l.facing === 'up' ? -1 : 1) * hh * 0.8 : 0;
      const sx = l.axis === 'x' ? w * 0.55 + 4 : 0, sy = l.axis === 'x' ? 0 : hh * 0.95;
      // [辺に そって, 外へ] の ずらし方を 近い じゅんに ためし、かさならない 最初の 場所（なければ いちばん かさなりの 少ない 場所）
      const moves = [[0, 0], [1, 0], [-1, 0], [0, 1], [1, 1], [-1, 1], [2, 0], [-2, 0], [0, 2]];
      let best = null, bestScore = Infinity;
      for (let i = 0; i < moves.length; i += 1) {
        const m = moves[i];
        const c = clampIn({ x: pt.x + sx * m[0] + outDx * m[1], y: pt.y + sy * m[0] + outDy * m[1], anchor: pt.anchor }, w, hh);
        const score = overlapArea(boxOf(c, w, hh));
        if (score === 0) { best = c; break; }
        if (score < bestScore) { bestScore = score; best = c; }
      }
      return reserve(best || pt, w, hh);
    }

    function layout(bw, bh) {
      const figs = model.figures || [];
      const n = figs.length;
      const namesH = model.names ? 1 : 0;
      let margin = 1.4, cell = 10, exts = null;
      for (let pass = 0; pass < 3; pass += 1) {
        exts = figs.map(function (f) { return extentOf(f, margin); });
        const gap = n > 1 ? 1.2 : 0;
        const totalW = exts.reduce(function (s, e) { return s + e.w; }, 0) + gap * (n - 1);
        const maxH = Math.max.apply(null, exts.map(function (e) { return e.h; })) + namesH * 1.2;
        cell = Math.min(bw / totalW, bh / maxH);
        const cap = Math.min(bw, bh) / (model.bigCap ? 3 : 4.4);
        cell = Math.min(cell, cap, 92);
        if (cell >= 6) cell = Math.floor(cell);
        const fsPx = labelFont(cell, bh);
        const need = (fsPx * 1.55) / cell;
        if (need <= margin + 0.05) break;
        margin = Math.min(need, 12);
      }
      const gap = n > 1 ? 1.2 : 0;
      const totalW = exts.reduce(function (s, e) { return s + e.w; }, 0) + gap * (n - 1);
      const maxH = Math.max.apply(null, exts.map(function (e) { return e.h; }));
      const ox0 = (bw - totalW * cell) / 2;
      const oy0 = (bh - (maxH + namesH * 1.2) * cell) / 2;
      let cursor = ox0;
      const placed = exts.map(function (e) {
        const ox = cursor;
        cursor += (e.w + gap) * cell;
        const oy = oy0 + (maxH - e.h) / 2 * cell;
        return {
          ext: e,
          X: function (x) { return ox + (x - e.x1) * cell; },
          Y: function (y) { return oy + (e.y2 - y) * cell; },
          left: ox, top: oy, right: ox + e.w * cell, bottom: oy + e.h * cell
        };
      });
      return { cell: cell, placed: placed, margin: margin, fs: labelFont(cell, bh), bw: bw, bh: bh };
    }

    function labelFont(cell, bh) {
      const vhMax = Math.max(14, Math.min(36, (root.innerHeight || 700) * 0.034));
      const byCell = cell * 0.92;
      return Math.max(12, Math.min(vhMax, Math.max(byCell, 13)));
    }

    function draw() {
      const bw = host.clientWidth, bh = host.clientHeight;
      const k = bw + 'x' + bh + ':' + version;
      if (bw && bh && k === drawnKey && root_.firstChild) return;
      while (root_.firstChild) root_.removeChild(root_.firstChild);
      if (!bw || !bh) { drawnKey = ''; return; }
      drawnKey = k;
      occupied = [];
      root_.setAttribute('width', bw);
      root_.setAttribute('height', bh);
      root_.setAttribute('viewBox', '0 0 ' + bw + ' ' + bh);
      defs();
      if (model.tilingDemo) { drawTiling(bw, bh); return; }
      const figs = model.figures || [];
      if (!figs.length) { geo = null; return; }
      geo = layout(bw, bh);
      const gridOn = figs.every(function (f) { return f.grid !== false; }) && geo.cell >= 8;
      if (gridOn) drawBoardGrid(bw, bh, geo.placed[0], geo.cell);
      figs.forEach(function (spec, i) { drawFigure(spec, geo.placed[i], i); });
      if (model.names) {
        figs.forEach(function (spec, i) {
          const pl = geo.placed[i];
          const b = pl.ext.b;
          const cx = (pl.X(b.x1) + pl.X(b.x2)) / 2;
          tag(cx, pl.bottom + geo.cell * 0.55, model.names[i], { fs: Math.max(18, Math.min(geo.fs * 1.1, 28)), bg: model.nameColors && model.nameColors[i] ? model.nameColors[i] : '#fbf9f2', fg: model.nameColors && model.nameColors[i] ? '#fbf9f2' : INK });
        });
      }
      drawLines();
      bindInteraction();
    }

    function defs() {
      const d = svg('defs', {}, root_);
      const pat = svg('pattern', { id: 'hatch', width: 12, height: 12, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, d);
      svg('rect', { width: 12, height: 12, fill: PAPER }, pat);
      svg('rect', { width: 6, height: 12, fill: '#e2e0d4' }, pat);
    }

    function drawBoardGrid(bw, bh, pl, cell) {
      const g = svg('g', { class: 'board-grid' }, root_);
      const x0 = pl.X(Math.floor(pl.ext.x1));
      const y0 = pl.Y(Math.ceil(pl.ext.y2));
      const startX = x0 - Math.ceil(x0 / cell) * cell;
      const startY = y0 - Math.ceil(y0 / cell) * cell;
      for (let x = startX; x <= bw + cell; x += cell) svg('line', { x1: x, y1: 0, x2: x, y2: bh, stroke: GRIDLINE, 'stroke-width': 2 }, g);
      for (let y = startY; y <= bh + cell; y += cell) svg('line', { x1: 0, y1: y, x2: bw, y2: y, stroke: GRIDLINE, 'stroke-width': 2 }, g);
    }

    function partsCells(spec, cells) {
      // 色分け: 解説・ガイドの parts があればそれ、なければ 自分で引いた線で分かれた かたまり
      const map = {};
      if (model.parts && model.parts.length) {
        let fillIndex = 0;
        model.parts.forEach(function (p, i) {
          if (p.role === 'box' || p.role === 'cutout') return;
          const color = (model.partColors || GUIDE_FILLS)[fillIndex % 4];
          fillIndex += 1;
          for (let x = p.x; x < p.x + p.w; x += 1) for (let y = p.y; y < p.y + p.h; y += 1) map[key(x, y)] = { color: color, part: i };
        });
        return map;
      }
      const lines = model.lines || [];
      if (!lines.length) return map;
      const blocked = new Set();
      lines.forEach(function (l) {
        if (l.x1 === l.x2) { for (let y = Math.min(l.y1, l.y2); y < Math.max(l.y1, l.y2); y += 1) blocked.add(key(l.x1 - 1, y) + '|' + key(l.x1, y)); }
        else if (l.y1 === l.y2) { for (let x = Math.min(l.x1, l.x2); x < Math.max(l.x1, l.x2); x += 1) blocked.add(key(x, l.y1 - 1) + '|' + key(x, l.y1)); }
      });
      const comps = Figure.components(cells, blocked);
      if (comps.length < 2) return map;
      comps.forEach(function (comp, i) { comp.forEach(function (k) { map[k] = { color: FREE_FILLS[i % 4], part: i }; }); });
      return map;
    }

    function drawFigure(spec, pl, figIndex) {
      const fig = spec.fig;
      const cell = geo.cell;
      const cells = Figure.cellSet(fig);
      const b = Figure.bounds(fig);
      const g = svg('g', { class: 'board-fig' }, root_);
      const primary = figIndex === 0;
      const colored = primary ? partsCells(spec, cells) : {};
      const placed = spec.tilesPlaced || null;
      const pre = placed ? placedCells(spec) : null;
      const tiles = primary && model.tiles ? model.tiles : null;
      const miss = primary && model.missCells ? model.missCells : null;
      const baseColor = (model.figColors && model.figColors[figIndex]) || SHAPE;
      // タイルを おく問題は、形を ぬらずに あき地（紙の色）にして、タイルだけを タイルらしく 見せる（本人の指摘 2026-09-15）
      const tileMode = spec.interaction === 'tiles' || !!placed;
      // 重ねた2つの形は、べつべつの すける色で（同じ色だと 1つに見えてしまう）
      const overlay = !!(spec.pieceColors && fig.pieces && fig.pieces.length > 1);
      // 囲んでひく（box/cutout）
      if (primary && model.parts) {
        model.parts.forEach(function (p) {
          if (p.role === 'cutout') svg('rect', { x: pl.X(p.x), y: pl.Y(p.y + p.h), width: p.w * cell, height: p.h * cell, fill: 'url(#hatch)', stroke: '#c9402f', 'stroke-width': 3, 'stroke-dasharray': '8 5' }, g);
        });
      }
      // 図形の 中の 方眼は「マスを 数えて よい 問題」だけ（本人の指定 2026-09-15: 背景の 方眼は あってよい）
      const gridIn = fig.grid !== false && cell >= 6 && model.innerGrid !== false;
      cells.forEach(function (k) {
        const c = Figure.parseKey(k);
        let fill = baseColor;
        if (colored[k]) fill = colored[k].color;
        if (tileMode || overlay) fill = '#fbf9f2';
        if (miss && miss.has(k)) fill = '#ef9448';
        const r = svg('rect', { x: pl.X(c.x), y: pl.Y(c.y + 1), width: cell, height: cell, fill: fill, class: 'fig-cell' }, g);
        if (gridIn) { r.setAttribute('stroke', tileMode ? '#b9b09a' : SHAPE_LINE); r.setAttribute('stroke-width', 1); }
        r.dataset.cell = k;
        r.dataset.fig = figIndex;
        if ((pre && pre.has(k)) || (tiles && tiles.has(k))) {
          const inset = Math.max(1, Math.min(3, cell * 0.08));
          svg('rect', { x: pl.X(c.x) + inset, y: pl.Y(c.y + 1) + inset, width: cell - inset * 2, height: cell - inset * 2, fill: TILE, stroke: TILE_LINE, 'stroke-width': 2, 'pointer-events': 'none', class: 'fig-tile' }, g);
        }
      });
      // 正方形パズル: 中の 区切り（どこが 1つの 正方形か）を 描く。これが ないと 解けない
      if (spec.pieceEdges && fig.pieces) fig.pieces.forEach(function (pc) {
        if (pc.role === 'hole') return;
        svg('rect', { x: pl.X(pc.x), y: pl.Y(pc.y + pc.h), width: pc.w * cell, height: pc.h * cell, fill: 'none', stroke: INK, 'stroke-width': 2, 'pointer-events': 'none' }, g);
      });
      if (overlay) {
        fig.pieces.forEach(function (pc, i) {
          const attrs = { x: pl.X(pc.x), y: pl.Y(pc.y + pc.h), width: pc.w * cell, height: pc.h * cell, fill: spec.pieceColors[i % spec.pieceColors.length], 'fill-opacity': 0.6, stroke: i ? '#c9402f' : '#2f5fa8', 'stroke-width': 4, 'pointer-events': 'none' };
          if (i) attrs['stroke-dasharray'] = '12 6';
          svg('rect', attrs, g);
        });
        fig.pieces.forEach(function (pc, i) {
          if (pc.name) tag(pl.X(pc.x + pc.w) - geo.fs * 1.1, pl.Y(pc.y + pc.h) + geo.fs * 0.95, pc.name, { fs: Math.max(14, Math.min(geo.fs, 24)), bg: i ? '#c9402f' : '#2f5fa8', fg: '#fbf9f2' });
        });
      }
      // 囲む大きい長方形（点線）
      if (primary && model.parts) {
        model.parts.forEach(function (p) {
          if (p.role === 'box') svg('rect', { x: pl.X(p.x), y: pl.Y(p.y + p.h), width: p.w * cell, height: p.h * cell, fill: 'none', stroke: '#3b7dd8', 'stroke-width': 3, 'stroke-dasharray': '10 6' }, g);
        });
      }
      // 外わく（太線）。重ねた形は それぞれの わくを 上で 描いたので いらない
      if (!overlay) Figure.boundaryEdgesOfCells(cells).forEach(function (e) {
        if (e.axis === 'h') svg('line', { x1: pl.X(e.from), y1: pl.Y(e.at), x2: pl.X(e.to), y2: pl.Y(e.at), stroke: INK, 'stroke-width': 3, 'stroke-linecap': 'square' }, g);
        else svg('line', { x1: pl.X(e.at), y1: pl.Y(e.from), x2: pl.X(e.at), y2: pl.Y(e.to), stroke: INK, 'stroke-width': 3, 'stroke-linecap': 'square' }, g);
      });
      // 解説で「面積」の らんを うめるとき: 形の ふちを 赤い 太線で かこむ（どこの 面積かを 見せる）
      if (primary && model.litArea && !overlay) Figure.boundaryEdgesOfCells(cells).forEach(function (e) {
        if (e.axis === 'h') svg('line', { x1: pl.X(e.from), y1: pl.Y(e.at), x2: pl.X(e.to), y2: pl.Y(e.at), stroke: LIT, 'stroke-width': 7, 'stroke-linecap': 'square' }, g);
        else svg('line', { x1: pl.X(e.at), y1: pl.Y(e.from), x2: pl.X(e.at), y2: pl.Y(e.to), stroke: LIT, 'stroke-width': 7, 'stroke-linecap': 'square' }, g);
      });
      // 解説の 行（外・内・かこむ など）が 図の どの長方形かを、行と 同じ色の わくで 見せる
      if (primary && model.litRect) {
        const lr = model.litRect;
        svg('rect', { x: pl.X(lr.x), y: pl.Y(lr.y + lr.h), width: lr.w * cell, height: lr.h * cell, fill: 'none', stroke: model.litRectColor || LIT, 'stroke-width': 6, 'stroke-dasharray': '10 6' }, g);
      }
      // 「ここを見る」の 辺に ラベルが ないとき（切った長方形の たて・よこ など）も 赤い 太線を 引く
      if (primary) (model.litDims || []).forEach(function (d) {
        if (!d || d.at == null) return;
        if (d.axis === 'x') svg('line', { x1: pl.X(d.a), y1: pl.Y(d.at), x2: pl.X(d.b), y2: pl.Y(d.at), stroke: LIT, 'stroke-width': 9, 'stroke-linecap': 'round' }, g);
        else svg('line', { x1: pl.X(d.at), y1: pl.Y(d.a), x2: pl.X(d.at), y2: pl.Y(d.b), stroke: LIT, 'stroke-width': 9, 'stroke-linecap': 'round' }, g);
      });
      // いま出している長方形（やり直し・ガイド）: 太いわく
      if (primary && model.activePart != null && model.parts && model.parts[model.activePart]) {
        const p = model.parts[model.activePart];
        svg('rect', { x: pl.X(p.x) + 2, y: pl.Y(p.y + p.h) + 2, width: p.w * cell - 4, height: p.h * cell - 4, fill: 'none', stroke: '#ffd37c', 'stroke-width': 5 }, g);
        svg('rect', { x: pl.X(p.x), y: pl.Y(p.y + p.h), width: p.w * cell, height: p.h * cell, fill: 'none', stroke: INK, 'stroke-width': 3 }, g);
      }
      // しるし
      (spec.marks || []).forEach(function (m) {
        if (m.kind === 'diagonal') {

        h('span', { class: 'row-label', text: f.label }),
        h('button', { class: 'blank-btn' + st, type: 'button', onclick: function () { if (!o.held) o.onFocus(f.key); } }, [v === '' ? '□' : v]),
        h('span', { class: 'blank-unit', plain: f.unit || '' })
      ]));
    });
    return rows;
  }

  function orderList(items, order, o) {
    const names = {};
    items.forEach(function (i) { names[i.id] = i.text; });
    const list = h('div', { class: 'order-list' });
    order.forEach(function (id, idx) {
      list.appendChild(h('div', { class: 'order-item' }, [
        h('span', { class: 'n', plain: String(idx + 1) }),
        h('span', { class: 't', text: names[id] }),
        o.held ? null : h('button', { class: 'px-btn', type: 'button', 'aria-label': '上へ', onclick: function () { if (idx > 0) o.onSwap(idx, idx - 1); } }, ['↑']),
        o.held ? null : h('button', { class: 'px-btn', type: 'button', 'aria-label': '下へ', onclick: function () { if (idx < order.length - 1) o.onSwap(idx, idx + 1); } }, ['↓'])
      ]));
    });
    return list;
  }

  // ほかの子の 答案（大事な 問題なので ふきだしの 中ではなく 大きな カードで 見せる。本人の指摘 2026-09-15）
  function peerCard(q, dark) {
    if (!q || !q.peerAnswer) return null;
    return h('div', { class: 'peer-card' + (dark ? ' dark' : '') }, [h('span', { class: 'hd', text: 'ほかの子の 答案' }), h('span', { class: 'tx', plain: q.peerAnswer })]);
  }

  Object.assign(UI, { peerCard: peerCard, formulaText: formulaText, figuresModel: figuresModel, mountBoard: mountBoard, hissanGrid: hissanGrid, hissanOverlay: hissanOverlay, flash: flash, numDisplay: numDisplay, choiceList: choiceList, fieldRows: fieldRows, orderList: orderList, floorLabelOf: floorLabelOf, guardOfSession: guardOfSession, unitKind: unitKind, askTag: askTag });

  function newState(key, q) {
    return {
      key: key,
      num: UI.numberInput(q.format === 'fields' ? 6 : 6),
      numState: '',
      choice: null,
      tiles: new Set(),
      order: q.order ? q.order.items.map(function (i) { return i.id; }) : null,
      pairs: [], pairA: '', pairB: '', pairFocus: 'a',
      fields: {}, fieldFocus: q.fields && q.fields.length ? q.fields[0].key : null,
      lines: [], hissan: null, help: null, hint: ''
    };
  }

  UI.screens.question = function (ctx) {
    const E = ctx.engine, st = ctx.state, p = E.progress();
    const hold = st.hold;
    const dungeonMain = hold ? hold.dungeonMain : E.phase() === 'underground-session';
    const sess = dungeonMain ? null : E.session();
    const q = hold ? hold.q : (dungeonMain ? E.undergroundQuestion() : E.currentQuestion());
    if (!q || (!dungeonMain && !sess)) { st.hold = null; E.goMap(); ctx.render(); return; }
    const ugs = p.undergroundSession;
    const ugNo = hold ? hold.ugNo : (ugs ? ugs.no : 1);
    const rematch = sess && sess.rematch ? sess.rematch : null;
    const dark = dungeonMain || !!(sess && sess.floorNo >= 100);
    const key = hold ? hold.key : (dungeonMain ? ['ug', ugs.no, ugs.stage, ugs.seed].join(':') : ['s', sess.startedAt, sess.index, q.templateId].join(':'));
    let qs = st.qs;
    if (!qs || qs.key !== key) qs = st.qs = newState(key, q);

    const guide = hold ? hold.guide : ((!dungeonMain && (q.format === 'cut' || q.format === 'line')) ? E.guide() : null);
    const gmode = guide ? guide.mode : null;
    const guided = gmode === 'full' || gmode === 'half' || gmode === 'three';
    const step = guided ? Guide.currentStep(guide) : null;
    const finalChoiceNow = guided && gmode === 'three' && guide.finished && q.finalChoice;
    const cutFree = q.figure && q.figure.interaction === 'cut';
    const drawable = !hold && !qs.hissan && !finalChoiceNow && (q.format === 'line' || (q.format === 'cut' && (!guided || (!step && !guide.finished))) || cutFree);

    let lines;
    if (hold) lines = hold.lines || [];
    else if (q.format === 'line') lines = dungeonMain ? (ugs ? ugs.lines : []) : (guide ? guide.lines : []);
    else if (guided) lines = guide.lines;
    else if (dungeonMain) lines = ugs ? ugs.lines : [];
    else lines = qs.lines;

    // ---- 背景 ----
    if (dark) UI.bg('dungeon', {}, { flicker: true, tintClass: 'dungeon-tint' });
    else UI.bg('room', { compound: q.format === 'cut' });
    // B30 では、つぎに出る 地下クリアの絵を 先に描いておく
    if (dungeonMain && ugNo >= 30) UI.prewarmScene('dungeonClear', {});

    const app = document.getElementById('app');
    const scr = h('div', { class: 'screen' });
    const layout = h('div', { class: 'q-layout' + (dark ? ' dungeon-layout' : '') });
    scr.appendChild(layout);

    // ---- 上の帯 ----
    const back = h('button', { class: 'back-btn' + (dark ? ' dark' : ''), type: 'button', 'aria-label': 'ホームへ', onclick: function () {
      st.hold = null;
      // 地下B30を とおった直後は、地下クリアの画面を 先に 見せる
      if (hold && hold.dungeonMain && hold.correct && hold.res && hold.res.finished) { ctx.render(); return; }
      E.goMap();
      ctx.render();
    } }, ['◀']);
    let headLeft;
    let roadEl, countText;
    if (dungeonMain) {
      headLeft = [back, h('div', { class: 'dungeon-depth', plain: '地下 B' + ugNo }), h('div', { class: 'dungeon-sub', text: '古の めいきゅう' })];
      const blockStart = Math.floor((ugNo - 1) / 10) * 10 + 1;
      const results = [];
      for (let d = blockStart; d < ugNo; d += 1) results.push(true);
      // 答えた直後は 旅人を いまの石に のこし、「おくへ」で 1マス 歩かせる
      if (hold && hold.correct && hold.res && hold.res.cleared) results.push(true);
      roadEl = UI.road(10, Math.min(9, ugNo - blockStart), results, null, { dark: true });
      countText = (ugNo - blockStart + 1) + '／10';
    } else {
      const status = E.sessionStatus();
      const label = floorLabelOf(sess);
      headLeft = [back, h('div', { class: dark ? 'dungeon-depth' : 'floor-label outline-text', plain: label })];
      if (rematch) headLeft.push(h('div', { class: 'head-tag', text: 'ずかんで たたかう' }));
      // 答えた直後は 旅人を 答えた石に のこし、「つぎへ」で 1マス 歩かせる
      const idx = hold && hold.sessIndex != null ? hold.sessIndex : Math.min(status.index, status.count - 1);
      roadEl = UI.road(status.count, idx, status.results, status.gates, { dark: dark });
      countText = (hold ? hold.sessIndex + 1 : status.index + 1) + '／' + status.count;
    }
    layout.appendChild(h('div', { class: 'q-head' }, [
      h('div', { class: 'q-head-left' }, headLeft),
      h('div', { class: 'q-head-right' }, [roadEl, h('div', { class: 'q-count' + (dark ? ' dark' : ''), plain: countText })])
    ]));

    // ---- 左: 番人・ふきだし・板 ----
    const body = h('div', { class: 'q-body' + (dark ? ' dungeon-body' : '') });
    layout.appendChild(body);
    const left = h('div', { class: 'q-left' });
    body.appendChild(left);
    const guardId = dungeonMain ? MT.Sprites.dungeonGuardFor(ugNo) : guardOfSession(sess);
    const tags = [];
    if (dungeonMain) {
      tags.push(h('span', { class: 'tag maze', text: 'めいきゅう' }));
      tags.push(h('span', { class: 'tag-note', text: 'とうたつ B' + Math.max(p.underground.reached, ugNo) + ' ／ B30' }));
    } else {
      if (q.role === 'surprise') { tags.push(h('span', { class: 'tag surprise', text: 'ぬきうち' })); tags.push(h('span', { class: 'tag-note', text: (q.originFloor || '') + '階の 番人の 関所。落とすと この階は やり直し' })); }
      else if (q.gate && !rematch) { tags.push(h('span', { class: 'tag', text: '関所' })); tags.push(h('span', { class: 'tag-note', text: '落とすと この階は やり直し' })); }
      if (q.role === 'carry') tags.push(h('span', { class: 'tag carry', text: 'もう一度' }));
      if (q.format === 'cut') tags.push(h('span', { class: 'tag kind', text: '組み合わせた形' }));
    }
    const bubbleKids = [];
    if (tags.length) bubbleKids.push(h('div', { class: 'tags' }, tags));
    bubbleKids.push(UI.tx(q.prompt));
    let extraText = '';
    if (finalChoiceNow) extraText = q.finalChoice.prompt;
    else if (step) extraText = step.ask;
    else if (guided && gmode === 'three' && !guide.finished) {
      const rest = ((q.cut && q.cut.modes) || ['v', 'h', 'e']).filter(function (w) { return guide.waysDone.indexOf(w) < 0; });
      extraText = 'のこり：' + rest.map(Guide.wayName).join('、');
    }
    if (qs.hissan) extraText = '式は 合っている。筆算で たしかめよう。';
    if (extraText) bubbleKids.push(h('span', { class: 'step-ask', text: extraText }));
    if (qs.hint) bubbleKids.push(h('span', { class: 'step-ask say-help', text: qs.hint }));
    const bubble = h('div', { class: 'bubble' + (dark ? ' stone' : '') + UI.bubbleSizeClass(String(q.prompt) + extraText + qs.hint) }, bubbleKids);
    const speaker = [UI.guardBox(guardId, dark ? 'dark' : ''), bubble];
    // 線を けす・ヒント・手帳
    const canClear = !hold && (q.format === 'line' || q.format === 'cut' || cutFree) && lines.length > 0 && !(guided && step && guide.stepIndex > 0) && !finalChoiceNow;
    if (q.format === 'line' || q.format === 'cut' || cutFree) {
      speaker.push(h('button', { class: 'side-btn' + (canClear ? ' on' : ''), type: 'button', onclick: function () { if (canClear) clearLines(); } }, [UI.tx('線を けす')]));
    }
    if (!hold && gmode === 'half' && !qs.hissan) {
      speaker.push(h('button', { class: 'side-btn on', type: 'button', onclick: function () { const hn = E.guideHint(); qs.hint = hn ? hn.text : ''; ctx.render(); } }, ['ヒント']));
    }
    if (q.handbook) speaker.push(h('button', { class: 'side-btn on', type: 'button', onclick: function () { UI.openHandbook(ctx); } }, [UI.tx('手帳')]));
    left.appendChild(h('div', { class: 'speaker-row' }, speaker));
    const pc = peerCard(q, dark);
    if (pc) left.appendChild(pc);

    const wrap = h('div', { class: 'board-wrap' + (dark ? ' dark' : '') + (hold ? (hold.correct ? ' ok' : ' ng') : '') });
    left.appendChild(wrap);
    const fm = figuresModel(q);
    let model = null;
    if (fm) {
      model = Object.assign({ showHidden: true, partColors: MT.Board.FREE_FILLS }, fm);
      if (!model.tilingDemo) {
        model.lines = lines;
        if (guided && guide.analysis && (guide.analysis.mode === 'cut' || guide.analysis.mode === 'enclose')) model.parts = Guide.partsForDisplay(guide);
        if (step && step.part != null) model.activePart = step.part;
        if (step && step.dim) model.litDims = [step.dim];
        if (qs.help) model.helpSegs = qs.help;
        const tilesQ = q.format === 'grid' && q.figure && q.figure.interaction === 'tiles';
        if (tilesQ) {
          const pre = MT.Board.placedCells(q.figure);
          model.tiles = qs.tiles;
          if (!hold) model.onTile = function (k, add) { if (pre.has(k)) return; if (add) qs.tiles.add(k); else qs.tiles.delete(k); board.set(model); drawRight(); };
        }
        if (drawable) model.onCut = onCut;
      }
    }
    // 図のない問題は 板に 問題文を大きく書く（答えたあとは はんこと重ならないよう 消す）
    const board = mountBoard(wrap, model, hold ? '' : q.prompt, dark);
    if (qs.hissan) wrap.appendChild(hissanOverlay(qs.hissan));
    if (hold) {
      UI.stamp(hold.correct, dark).forEach(function (n) { wrap.appendChild(n); });
      const title = hold.correct ? (dungeonMain ? 'とおった！' : 'せいかい！') : 'ちがう…';
      wrap.appendChild(UI.band(hold.correct, title, hold.fbText, { dark: dark }));
    }

    // ---- 右: 答え ----
    let right = buildRight();
    body.appendChild(right);
    function drawRight() { const n = buildRight(); right.replaceWith(n); right = n; }

    function buildRight() {
      const col = h('div', { class: 'q-right' });
      // 筆算（ガイドの計算で まちがえたとき）
      if (qs.hissan) {
        const cur = MT.Hissan.current(qs.hissan);
        col.appendChild(h('div', { class: 'col-label', text: cur ? (cur.label ? cur.label + '　' : '') + cur.expr + ' ＝ ?' : '' }));
        col.appendChild(numDisplay(qs.num.value, '', { dark: dark, state: qs.numState }));
        col.appendChild(UI.keypad(typeKey, { dark: dark }));
        col.appendChild(h('button', { class: 'answer-btn' + (dark ? ' dark' : '') + (qs.num.value ? '' : ' disabled'), type: 'button', onclick: answerHissan }, ['こたえる']));
        return col;
      }
      if (finalChoiceNow || q.format === 'choice') {
        const choices = finalChoiceNow ? q.finalChoice.choices : q.choices;
        col.appendChild(h('div', { class: 'col-label', text: 'ひとつ えらぼう' }));
        col.appendChild(choiceList(choices, { selected: qs.choice, held: !!hold, given: hold && hold.given, correct: hold && hold.correct, dark: dark, onPick: function (id) { qs.choice = id; drawRight(); } }));
        col.appendChild(answerButton(qs.choice != null, function () { submitAnswer(qs.choice); }));
        return col;
      }
      if (q.format === 'fields') {
        col.appendChild(fieldRows(q.fields, qs.fields, qs.fieldFocus, { held: !!hold, results: hold && hold.res && hold.res.result && hold.res.result.fields || (hold && hold.res && hold.res.fields) || null, onFocus: function (k) { qs.fieldFocus = k; drawRight(); } }));
        col.appendChild(UI.keypad(typeKey, { dark: dark }));
        const filled = q.fields.some(function (f) { return (qs.fields[f.key] || '') !== ''; });
        col.appendChild(answerButton(filled, submitFields));
        return col;
      }
      if (q.format === 'order') {
        col.appendChild(h('div', { class: 'col-label', text: '1が いちばん 小さい' }));
        col.appendChild(orderList(q.order.items, qs.order, { held: !!hold, onSwap: function (a, b) { const t = qs.order[a]; qs.order[a] = qs.order[b]; qs.order[b] = t; drawRight(); } }));
        col.appendChild(answerButton(true, function () { submitAnswer(qs.order.slice()); }));
        return col;
      }
      if (q.format === 'pairs') {
        const row = h('div', { class: 'fill-row active' }, [
          h('span', { class: 'row-label', text: 'たて' }),
          h('button', { class: 'blank-btn' + (qs.pairFocus === 'a' ? ' on' : ''), type: 'button', onclick: function () { qs.pairFocus = 'a'; drawRight(); } }, [qs.pairA || '□']),
          h('span', { class: 'fill-part', plain: '×' }),
          h('span', { class: 'row-label', text: 'よこ' }),
          h('button', { class: 'blank-btn' + (qs.pairFocus === 'b' ? ' on' : ''), type: 'button', onclick: function () { qs.pairFocus = 'b'; drawRight(); } }, [qs.pairB || '□']),
          h('button', { class: 'px-btn pair-add', type: 'button', onclick: addPair }, [UI.tx('入れる')])
        ]);
        col.appendChild(h('div', { class: 'fill-rows' }, [row]));
        col.appendChild(h('div', { class: 'pairs-found' }, qs.pairs.map(function (pr) { return h('span', { class: 'pair-chip', plain: pr[0] + '×' + pr[1] }); })));
        col.appendChild(UI.keypad(typeKey, { dark: dark }));
        col.appendChild(answerButton(qs.pairs.length > 0, function () { submitAnswer(qs.pairs.slice()); }, 'ぜんぶ 見つけた'));
        return col;
      }
      if (q.format === 'line') {
        col.appendChild(h('div', { class: 'col-label', text: '線を 引いたら' }));
        col.appendChild(h('div', { style: 'flex:1' }));
        col.appendChild(answerButton(lines.length > 0, function () { submitAnswer(null); }, 'これで 分ける'));
        return col;
      }
      if (guided && !step && !hold) {
        col.appendChild(numDisplay('', '', { dark: dark }));
        col.appendChild(UI.keypad(function () {}, { dark: dark }));
        col.appendChild(h('button', { class: 'answer-btn wait', type: 'button' }, [UI.tx('線を 引くと すすめる')]));
        return col;
      }
      const tilesQ = q.format === 'grid' && q.figure && q.figure.interaction === 'tiles';
      // はじめから おいてある タイルも ふくめて 数える
      if (tilesQ) { const pre = MT.Board.placedCells(q.figure); let n = pre.size; qs.tiles.forEach(function (k) { if (!pre.has(k)) n += 1; }); col.appendChild(h('div', { class: 'col-label', text: 'おいた タイル ' + n + ' まい' })); }
      else if (step) col.appendChild(h('div', { class: 'col-label', text: step.ask }));
      const unit = step ? step.unit : (q.unit || '');
      // 長さを 聞かれているのか 面積かを はっきり 出す
      if (!tilesQ && unitKind(unit)) col.appendChild(askTag(unit));
      const valState = hold ? (hold.correct ? 'ok' : 'ng') : qs.numState;
      col.appendChild(numDisplay(hold ? String(hold.given == null ? '' : hold.given) : qs.num.value, unit, { dark: dark, state: valState }));
      col.appendChild(UI.keypad(typeKey, { dark: dark }));
      col.appendChild(answerButton(qs.num.value !== '', function () { if (step) answerStep(); else submitAnswer(qs.num.value); }));
      return col;
    }

    function answerButton(ready, onGo, label) {
      if (hold) {
        let lab = 'つぎへ　▶';
        let cls = 'answer-btn next';
        if (hold.dungeonMain) {
          if (hold.correct) lab = hold.res.extra ? 'つづきへ　▶' : (hold.res.finished ? 'さいごへ　▶' : 'おくへ すすむ　▶');
          else { lab = 'もう一度'; cls = 'answer-btn'; }
          cls += ' dark';
        } else if (dark) cls += ' dark';
        return h('button', { class: cls, type: 'button', onclick: next }, [UI.tx(lab)]);
      }
      return h('button', { class: 'answer-btn' + (dark ? ' dark' : '') + (ready ? '' : ' disabled'), type: 'button', onclick: function () { if (ready) onGo(); } }, [UI.tx(label || (dungeonMain ? 'きざむ' : 'こたえる'))]);
    }

    // ---- 入力 ----
    function typeKey(k) {
      if (hold) { if (k === 'enter') next(); return; }
      if (q.format === 'fields') {
        const f = qs.fieldFocus;
        if (k === 'enter') {
          const empty = q.fields.filter(function (x) { return (qs.fields[x.key] || '') === ''; })[0];
          if (empty && (qs.fields[f] || '') !== '') { qs.fieldFocus = empty.key; drawRight(); return; }
          if (q.fields.some(function (x) { return (qs.fields[x.key] || '') !== ''; })) submitFields();
          return;
        }
        let v = qs.fields[f] || '';
        if (k === 'back') v = v.slice(0, -1); else if (k === 'clear') v = ''; else if (v.length < 7) v = (v + k).replace(/^0+(?=\d)/, '');
        qs.fields[f] = v;
        drawRight();
        return;
      }
      if (q.format === 'pairs') {
        if (k === 'enter') { if (qs.pairA && !qs.pairB) { qs.pairFocus = 'b'; drawRight(); } else if (qs.pairA && qs.pairB) addPair(); return; }
        const fk = qs.pairFocus === 'a' ? 'pairA' : 'pairB';
        let v = qs[fk];
        if (k === 'back') v = v.slice(0, -1); else if (k === 'clear') v = ''; else if (v.length < 4) v = (v + k).replace(/^0+(?=\d)/, '');
        qs[fk] = v;
        drawRight();
        return;
      }
      if (k === 'enter') {
        if (!qs.num.value) return;
        if (qs.hissan) answerHissan(); else if (step) answerStep(); else submitAnswer(qs.num.value);
        return;
      }
      if (qs.numState === 'ng') { qs.num.clear(); qs.numState = ''; }
      if (k === 'back') qs.num.back(); else if (k === 'clear') qs.num.clear(); else qs.num.type(k);
      drawRight();
    }

    function addPair() {
      const x = MT.Util.parseInteger(qs.pairA), y = MT.Util.parseInteger(qs.pairB);
      if (x == null || y == null || x <= 0 || y <= 0) return;
      if (x * y !== q.pairs.area) { UI.se('wrong'); flash(wrap, x + '×' + y + '＝' + (x * y) + '。' + q.pairs.area + ' に ならない'); qs.pairA = ''; qs.pairB = ''; qs.pairFocus = 'a'; drawRight(); return; }
      const lo = Math.min(x, y), hi = Math.max(x, y);
      if (!qs.pairs.some(function (pr) { return pr[0] === lo && pr[1] === hi; })) qs.pairs.push([lo, hi]);
      UI.se('tap');
      qs.pairA = ''; qs.pairB = ''; qs.pairFocus = 'a';
      drawRight();
    }

    function submitFields() {
      const o = {};
      q.fields.forEach(function (f) { o[f.key] = qs.fields[f.key] || ''; });
      submitAnswer(o);
    }

    function answerStep() {
      if (!qs.num.value) return;
      const res = E.guideAnswer(qs.num.value);
      if (res.empty) return;
      if (!res.correct) {
        UI.se('wrong');
        if (res.calc && !qs.hissan) {
          qs.hissan = MT.Hissan.plan(res.calc[0], res.calc[1], res.calc[2]);
          qs.num.clear(); qs.numState = '';
          ctx.render();
          return;
        }
        if (res.stopCount >= 2) qs.help = sessionHelpSegments(q, guide);
        qs.numState = 'ng';
        ctx.render();
        return;
      }
      UI.se('tap');
      qs.num.clear(); qs.numState = ''; qs.hissan = null; qs.help = null; qs.hint = '';
      if (res.finished) { submitAnswer(String(res.total)); return; }
      ctx.render();
    }

    function answerHissan() {
      const hs = qs.hissan;
      const n = MT.Util.parseInteger(qs.num.value);
      if (n == null) return;
      const r = MT.Hissan.answer(hs, n);
      if (!r.correct) {
        UI.se('wrong');
        qs.num.clear();
        if (r.fails >= 3) flash(wrap, '答えは ' + r.step.answer + '。写して すすもう');
        else flash(wrap, 'もう一度');
        drawRight();
        return;
      }
      UI.se('tap');
      qs.num.clear();
      if (r.done) {
        qs.hissan = null;
        qs.num.value = String(r.result);
        ctx.render();
        flash(document.querySelector('.board-wrap'), '筆算で ' + r.result + ' が 出た。こたえる を おそう');
        return;
      }
      ctx.render();
    }

    function onCut(segs) {
      if (q.format === 'line') {

    function onKey(k) {

          else if (doneMode) goRedo();
        }
        return;
      }
      if (k === 'back') { rs.value = rs.value.slice(0, -1); rs.ng = false; redrawRight(); return; }
      if (k === 'clear') { rs.value = ''; rs.ng = false; redrawRight(); return; }
      if (k === 'enter') { if (rs.value) submit(t); return; }

    }

    function submit(t) {
      if (t.kind === 'ghissan') {
        const r = MT.Hissan.answer(rs.hissan, MT.Util.parseInteger(rs.value));
        if (!r.correct) { UI.se('wrong'); rs.ng = true; if (r.fails >= 3) UI.flash(wrap, '答えは ' + r.step.answer + '。写して すすもう'); redrawRight(); return; }

        res = E.retryGuideAnswer(rs.value);

      }
      else res = E.retryBlank(t.blank, rs.value);
      if (!res || res.empty) return;
      if (!res.correct) {
        UI.se('wrong');
        rs.ng = true;
        if (t.kind === 'guide' && res.calc && !rs.hissan) { rs.hissan = MT.Hissan.plan(res.calc[0], res.calc[1], res.calc[2]); rs.value = ''; rs.ng = false; }
        ctx.render();
        return;
      }
      UI.se(res.itemDone ? 'correct' : 'tap');
      rs.value = ''; rs.ng = false;
      ctx.render();
    }

    if (st.admin && st.adminShowAnswer) { const rv = E.retryReveal(); if (rv) scr.appendChild(h('div', { class: 'admin-answer', plain: 'こたえ： ' + rv.text })); }

    }

    function addPair() {
      const x = MT.Util.parseInteger(rs.pairA), y = MT.Util.parseInteger(rs.pairB);

      else if (kind === 'choice') { given = rs.choice; res = E.retryChoice(given); }
      else if (kind === 'order') { given = rs.order.slice(); res = E.retryOrder(given); }
      else if (kind === 'pairs') { given = rs.pairs.slice(); res = E.retryPairs(given); }
      else if (q.format === 'fields') { given = {}; q.fields.forEach(function (f) { given[f.key] = rs.fields[f.key] || ''; }); res = E.retryReanswer(given); }
      else { given = rs.value; res = E.retryReanswer(given); }

        if (res.reveal) { const rv = E.retryReveal(); text = rv ? '答えは ' + rv.text + '。写して すすもう。つぎの階で もう一度 出るよ。' : ''; }
        else if (res.help) text = res.help.text;
        else text = MT.Bank.explanationFor(q, { misconception: res.misconception || v.item.misconception });
        rs.fb = { text: text };
        rs.lastGiven = given;

      ctx.render();

    function nextItem() { st.retryHold = null; ctx.render(); }

    if (st.admin && st.adminShowAnswer && !held) { const rv = E.retryReveal(); if (rv) scr.appendChild(h('div', { class: 'admin-answer', plain: 'こたえ： ' + rv.text })); }

    function onKey(k) {
      if (held) { if (k === 'enter') nextItem(); return; }

        const choices = shuffleChoices(kind === 'final' ? q.finalChoice.choices : q.choices, rs);

        if (k === 'enter' && ready()) submit();
        return;

        const fk = rs.pairFocus === 'a' ? 'pairA' : 'pairB';
        let val = rs[fk];

        return;

      if (k === 'enter') { if (ready()) submit(); return; }
      if (k === 'back') rs.value = rs.value.slice(0, -1);
      else if (k === 'clear') rs.value = '';
      else if (rs.value.length < 6) rs.value = (rs.value + k).replace(/^0+(?=\d)/, '');
      redrawRight();

(function (root) {

      getItem: function (k) { return root.localStorage.getItem(SLOT + k); },

  UI.adminMode = {
    on: function () { return lsGet(K_MODE) === 'on'; },
    set: function (v) {
      lsSet(K_MODE, v ? 'on' : null);
      if (!v) { lsSet(K_PLAY, null); lsSet(K_ANS, null); try { slot().removeItem(MT.Progress.STORAGE_KEY); } catch (e) { /* ignore */ } }
    },
    playing: function () { return lsGet(K_PLAY) === '1'; },
    setPlaying: function (v) { lsSet(K_PLAY, v ? '1' : null); },
    showAnswer: function () { return lsGet(K_ANS) !== '0'; },
    setShowAnswer: function (v) { lsSet(K_ANS, v ? null : '0'); },

  // ためしプレイ用の エンジン。その階の 手前まで クリアした ことにする（mem: 小さい 窓の 中だけで 使う 保存）
  function sandbox(floor, o) {

    const f = Math.max(1, Math.min(15, floor));

  function wrongGiven(q) {

  // えらんだ 問題 1問だけの 回にする。toRetry なら まちがえて まちがい直しへ

    let E = sb.engine;

    if (E.phase() === 'intro') E.finishIntro('100');
    const p = E.progress();
